# Chay DarboardOS Server NGOAI Home Assistant (Docker thuan, may x86-64).
# Trong Home Assistant OS/Supervised hay dung addon (hassio/remote_webview_server) thay vi file nay.
services:
  rwvserver:
    image: ghcr.io/minhquanghp86/darboardos-server:chrome-h264   # chi co ban linux/amd64
    container_name: remote-webview-server
    restart: unless-stopped
    environment:
      WS_PORT: 8081                 # man hinh ESP32 ket noi toi day
      HEALTH_PORT: 18080            # /metrics + trang ung dung cua menu + Menu panel (chi LAN)
      DEBUG_PORT: 9221              # Chrome DevTools noi bo (127.0.0.1)
      USER_DATA_DIR: /pw-data       # ho so trinh duyet (dang nhap HA) — gan volume ben
      BROWSER_LOCALE: "vi-VN"
      PREFERS_REDUCED_MOTION: "false"
      # Gia tri DU PHONG (firmware remote_webview luon tu gui gia tri rieng khi ket noi):
      TILE_SIZE: 32
      JPEG_QUALITY: 85
      MAX_BYTES_PER_MESSAGE: 61440
      MIN_FRAME_INTERVAL_MS: 80
      # Tuy chon: go2rtc cho ung dung "Camera nha" (mac dinh http://127.0.0.1:1984)
      # GO2RTC_URL: http://192.168.1.10:1984
      # Tuy chon: mo DevTools ra LAN (CANH BAO: ai vao duoc cong nay dieu khien duoc trinh duyet)
      # EXPOSE_DEBUG_PROXY: "true"
      # DEBUG_PROXY_PORT: 9222
      # Ngoai HA khong co ingress: cho phep LUU cau hinh menu tu http://<may>:18080/launcher-config.html
      # (bat ky may nao trong LAN deu sua duoc menu — chi bat neu mang tin cay)
      # LAUNCHER_CONFIG_OPEN: "1"
    network_mode: host             # giong addon: cong 8081/18080 tren may chu
    volumes:
      - ./pw-data:/pw-data
      - ./data:/app/data           # cau hinh menu (launcher.json) khi khong co /data cua addon
    shm_size: 1gb
