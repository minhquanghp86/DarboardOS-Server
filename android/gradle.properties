# JVM args for the Gradle daemon (host has limited RAM/disk -> keep it modest)
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# No AndroidX / Jetifier needed: this app uses only framework classes.
android.useAndroidX=false
android.enableJetifier=false
android.nonTransitiveRClass=true

kotlin.code.style=official
# Compile Kotlin inside the Gradle daemon: no extra Kotlin daemon process needed
# (this machine is memory/disk constrained and the Kotlin daemon can fail to start).
kotlin.compiler.execution.strategy=in-process
