# Kiem tra moi PR / moi lan push: kieu (ca file test), unit test, build, va THU TICH HOP (server that + Chromium that
# + panel gia qua WebSocket — src/integration/). Thu tich hop bat duoc nhung loi chi lo ra khi cac phan that chay cung
# nhau (vd race tao trung tab o 2.9.48, CurrentURL khong gui khi mo dung Home URL, khung doi kich thuoc lam "Frame
# error") — truoc khi ban nao duoc nap len HASS.
name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - "claude/**"
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Kieu + unit test + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Kiem tra kieu (ca file test)
        run: npm run typecheck
      - name: Unit test
        run: npm run test:run
      - name: Build (tsc + dong goi Shell)
        run: npm run build

  integration:
    name: Thu tich hop (server + Chromium)
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chrome co san tren runner
        run: |
          CHROME=$(command -v google-chrome-stable || command -v google-chrome)
          echo "CHROME_EXECUTABLE=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
      - name: Thu tich hop
        run: npm run test:integration
