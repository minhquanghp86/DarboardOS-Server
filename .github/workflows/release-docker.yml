name: Build & Push to ghcr.io

on:
  push:
    branches: 
      - main
      - feature/**    # ← thêm dòng này
    tags:
    - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            # (14/09/2026) Nhánh SẢN XUẤT: hassio/remote_webview_server/build.yaml
            # trỏ tới tag này (ghcr.io/...:chrome-h264) nhưng workflow trước đây
            # KHÔNG hề tạo tag đó -> build xong add-on vẫn dùng image cũ.
            type=raw,value=chrome-h264,enable=${{ github.ref == 'refs/heads/chrome-h264' }}
            # (14/09/2026) nhanh `main` cung tao cung tag nay: day la nhanh HA doc
            # metadata add-on + la noi code se duoc merge ve -> image luon moi.
            type=raw,value=chrome-h264,enable=${{ github.ref == 'refs/heads/main' }}
            # (01/10/2026) THU TREN MAY THAT truoc khi gop main (nguoi dung yeu cau: lam tren nhanh, duyet roi moi gop):
            # commit tren nhanh feature/** co "[thu-may-that]" trong noi dung -> image nhanh cung gan tag chrome-h264
            # (add-on dung tag nay). Khong duyet -> build lai main de quay ve.
            type=raw,value=chrome-h264,enable=${{ startsWith(github.ref, 'refs/heads/feature/') && contains(github.event.head_commit.message, '[thu-may-that]') }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
