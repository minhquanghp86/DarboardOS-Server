<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quản lý file</title>
<!--
  (01/10/2026) UNG DUNG "THU VIEN" + "TEP" cua panel co the SD (chi P4 — firmware cam_app, xem src/camProxy.ts).
    files.html?view=gallery  Thu vien: anh/video trong DCIM theo ngay, loc Anh/Video, xem anh (vuot, phong to), phat video
                             (tua, +-10 s). Mo tu nut thu vien cua ung dung Camera (&from=camera -> nut quay lai Camera).
    files.html               Tep: duyet ca the, sap xep, xem anh/video/van ban, xoa tep / thu muc (chon nhieu).
  Moi lenh qua /api/cam/sd/{ls,get,rm,thumb}. Xoa luon hoi lai trong trang (khong co hop thoai he thong tren panel).
  Nut quay lai / vuot quay lai cua he thong: history (pushState) cho thu muc va trinh xem.
-->
<link rel="stylesheet" href="/ui.css">
<script src="/ui.js"></script>
<script src="/icons.js"></script>
<style>
  :root { --accent: #14b8a6; --hdr: clamp(48px, 9.5vmin, 60px); }
  html, body { height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  svg { width: 24px; height: 24px; fill: currentColor; flex: none; }
  button { font: inherit; color: inherit; }

  /* Thanh dau */
  header { flex: none; height: var(--hdr); display: flex; align-items: center; gap: 10px; padding: 0 var(--pad);
    border-bottom: 1px solid var(--line); }
  .ib { width: 44px; height: 44px; border-radius: 50%; border: none; background: none; display: inline-flex; align-items: center;
    justify-content: center; cursor: pointer; flex: none; }
  .ib:active { background: var(--surface-2); }
  .ttl { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .ttl b { font-size: clamp(16px, 3.6vmin, 21px); font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ttl small { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--surface-2);
    font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pill .bar { width: 54px; height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
  .pill .bar i { display: block; height: 100%; background: var(--accent); }
  .pill.warn .bar i { background: var(--warn); }
  .seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; }
  .seg button { border: none; background: none; padding: 7px 13px; border-radius: 999px; font-size: 13.5px; font-weight: 600;
    color: var(--muted); cursor: pointer; white-space: nowrap; }
  .seg button.on { background: var(--surface-3); color: var(--text); }
  .txtbtn { border: none; background: var(--surface-2); border-radius: 999px; padding: 9px 16px; font-weight: 650; cursor: pointer; white-space: nowrap; }
  .txtbtn.danger { background: var(--err); color: #fff; }
  .txtbtn:disabled { opacity: .45; }
  header.sel { background: color-mix(in srgb, var(--accent) 16%, var(--bg)); }

  main { flex: 1; overflow-y: auto; overscroll-behavior: contain; }

  /* Thu vien: luoi theo ngay */
  .day { padding: 14px var(--pad) 4px; font-size: 13.5px; font-weight: 700; color: var(--muted); letter-spacing: .2px; }
  .grid { display: grid; gap: 4px; padding: 0 var(--pad); grid-template-columns: repeat(auto-fill, minmax(clamp(110px, 17vw, 180px), 1fr)); }
  .tile { position: relative; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; background: var(--surface-2); border: none;
    padding: 0; cursor: pointer; max-width: 100%; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .tile .ph svg { width: 34%; height: 34%; }
  .tile .meta { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 4px; padding: 14px 7px 4px;
    font-size: 11.5px; font-weight: 600; color: #fff; background: linear-gradient(to top, rgba(0,0,0,.7), transparent);
    font-variant-numeric: tabular-nums; }
  .tile .meta svg { width: 15px; height: 15px; }
  .tile .ck, .row .ck { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; color: #fff; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
  .tile.on { outline: 3px solid var(--accent); outline-offset: -3px; }
  .tile.on .ck { color: var(--accent); }
  .more { display: flex; justify-content: center; padding: 18px; }

  /* Tep: danh sach */
  .crumbs { display: flex; gap: 4px; align-items: center; padding: 8px var(--pad); overflow-x: auto; white-space: nowrap; border-bottom: 1px solid var(--line); }
  .crumbs button { border: none; background: none; padding: 6px 8px; border-radius: 8px; font-weight: 600; color: var(--muted); cursor: pointer; }
  .crumbs button:last-child { color: var(--text); }
  .crumbs span { color: var(--muted); }
  .list { display: flex; flex-direction: column; }
  .row { position: relative; display: flex; align-items: center; gap: 14px; padding: 0 var(--pad); min-height: clamp(54px, 10vmin, 64px);
    border: none; background: none; text-align: left; cursor: pointer; border-bottom: 1px solid var(--line); }
  .row:active { background: var(--surface); }
  .row .ic { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex: none;
    background: var(--surface-2); color: var(--muted); overflow: hidden; }
  .row .ic img { width: 100%; height: 100%; object-fit: cover; }
  .row .ic.dir { background: color-mix(in srgb, #f59e0b 22%, var(--surface-2)); color: #fbbf24; }
  .row .ic.img { color: #5eead4; } .row .ic.vid { color: #f472b6; } .row .ic.aud { color: #a78bfa; } .row .ic.txt { color: #93c5fd; }
  .row .tx { flex: 1; min-width: 0; }
  .row .n { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .s { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .row .ck { position: static; color: var(--muted); }
  .row.on { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .row.on .ck { color: var(--accent); }

  /* Hop xac nhan (khong dung confirm() — panel khong co hop thoai he thong) */
  #sheet { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; justify-content: center; z-index: 30; }
  #sheet .box { width: min(520px, 100%); background: var(--surface); border-radius: var(--r-lg) var(--r-lg) 0 0; padding: 22px var(--pad) 18px;
    display: flex; flex-direction: column; gap: 10px; }
  #sheet h2 { margin: 0; font-size: 18px; }
  #sheet p { margin: 0; color: var(--muted); line-height: 1.45; word-break: break-word; }
  #sheet .acts { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }

  /* Trinh xem */
  #view { position: fixed; inset: 0; background: #000; z-index: 20; overflow: hidden; touch-action: none; }
  #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage img { max-width: 100%; max-height: 100%; transform-origin: 0 0; will-change: transform; }
  #stage video { width: 100%; height: 100%; object-fit: contain; }
  #stage pre { position: absolute; inset: var(--hdr) 0 0; margin: 0; padding: 14px var(--pad); overflow: auto; color: #e5e7eb; background: #0b0d12;
    font: 13px/1.5 "DejaVu Sans Mono", monospace; white-space: pre-wrap; word-break: break-word; user-select: text; touch-action: pan-y; }
  .vtop { position: absolute; top: 0; left: 0; right: 0; height: var(--hdr); display: flex; align-items: center; gap: 8px; padding: 0 10px;
    background: linear-gradient(to bottom, rgba(0,0,0,.7), transparent); color: #fff; transition: opacity .2s; }
  .vtop .ttl small { color: rgba(255,255,255,.7); }
  .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 56px; height: 96px; border: none; background: rgba(0,0,0,.25);
    color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: opacity .2s; }
  .nav svg { width: 36px; height: 36px; }
  #prev { left: 0; border-radius: 0 12px 12px 0; } #next { right: 0; border-radius: 12px 0 0 12px; }
  #view.bare .vtop, #view.bare .nav, #view.bare .vctl { opacity: 0; pointer-events: none; }
  .vctl { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 10px; padding: 16px 14px 14px;
    background: linear-gradient(to top, rgba(0,0,0,.75), transparent); color: #fff; transition: opacity .2s; font-variant-numeric: tabular-nums; }
  .vctl .t { font-size: 13px; font-weight: 600; min-width: 44px; text-align: center; }
  .vctl input[type=range] { flex: 1; accent-color: var(--accent); height: 28px; }
  #bigplay { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 84px; height: 84px; border-radius: 50%;
    border: none; background: rgba(0,0,0,.5); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  #bigplay svg { width: 48px; height: 48px; }
  .vmsg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #e5e7eb; text-align: center; max-width: 80%;
    line-height: 1.5; }
  #toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: rgba(17,24,39,.94); color: #f9fafb; z-index: 40;
    padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 600; max-width: 80vw; text-align: center; }
  @media (max-width: 600px) { .pill .bar { display: none; } .seg button { padding: 7px 9px; } }
</style>
</head>
<body class="rwv-app">
<header id="hdr"></header>
<main id="main"></main>
<div id="view" hidden>
  <div id="stage"></div>
  <button class="nav" id="prev" aria-label="Trước"></button>
  <button class="nav" id="next" aria-label="Sau"></button>
  <div class="vtop" id="vtop"></div>
  <div class="vctl" id="vctl" hidden></div>
</div>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>
<script>
(function () {
  'use strict';
  var IC = window.RwvIcons || {};
  var q = new URLSearchParams(location.search);
  var GALLERY = q.get('view') === 'gallery';
  var FROM_CAMERA = q.get('from') === 'camera';
  var GDIR = '/DCIM';
  document.title = GALLERY ? 'Thư viện' : 'Quản lý file';
  var $ = function (id) { return document.getElementById(id); };
  function svg(name) {
    var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('viewBox', '0 0 24 24');
    var p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('d', IC[name] || ''); s.appendChild(p); return s;
  }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function ib(icon, label, fn) { var b = el('button', 'ib'); b.setAttribute('aria-label', label); b.appendChild(svg(icon)); b.onclick = fn; return b; }
  var toastT = 0;
  function toast(m, ms) { var t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, ms || 2800); }

  function api(path, method) {
    return fetch('/api/cam' + path, { method: method || 'GET', cache: 'no-store' }).then(function (r) {
      return r.json().catch(function () { return null; }).then(function (j) {
        if (!r.ok) throw new Error((j && (j.err || j.error)) || ('HTTP ' + r.status));
        return j;
      });
    });
  }
  var enc = encodeURIComponent;
  var join = function (dir, n) { return (dir === '/' ? '' : dir) + '/' + n; };
  var fileUrl = function (p) { return '/api/cam/sd/get?p=' + enc(p); };
  var thumbUrl = function (p, it) { return '/api/cam/sd/thumb?p=' + enc(p) + '&s=' + it.s + '&t=' + it.t; };

  // ---- Dinh dang ----
  var KIND = [[/\.(jpe?g|png|gif|webp|bmp)$/i, 'img'], [/\.(mkv|mp4|m4v|webm|mov)$/i, 'vid'], [/\.(mp3|wav|m4a|aac|ogg|opus|flac)$/i, 'aud'],
    [/\.(txt|log|csv|json|ya?ml|md|ini|conf)$/i, 'txt']];
  function kindOf(it) { if (it.d) return 'dir'; for (var i = 0; i < KIND.length; i++) if (KIND[i][0].test(it.n)) return KIND[i][1]; return 'file'; }
  var ICON_OF = { dir: 'folder', img: 'image', vid: 'file-video-outline', aud: 'music-note', txt: 'file-document-outline', file: 'file-outline' };
  function size(b) {
    if (b < 1024) return b + ' B';
    var u = ['KB', 'MB', 'GB'], v = b / 1024, i = 0; while (v >= 1024 && i < 2) { v /= 1024; i++; }
    return v.toLocaleString('vi-VN', { maximumFractionDigits: v < 10 ? 1 : 0 }) + ' ' + u[i];
  }
  // Ten do camera dat (IMG_20261001_101500) = gio dia phuong chinh xac; tep khac dung gio sua doi.
  function timeOf(it) {
    var m = /^(?:IMG|VID)_(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})(\d{2})/.exec(it.n);
    return m ? new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]) : new Date(it.t * 1000);
  }
  var p2 = function (n) { return String(n).padStart(2, '0'); };
  var hm = function (d) { return p2(d.getHours()) + ':' + p2(d.getMinutes()); };
  var WD = ['Chủ nhật', 'Thứ hai', 'Thứ ba', 'Thứ tư', 'Thứ năm', 'Thứ sáu', 'Thứ bảy'];
  function dayLabel(d) {
    var a = new Date(d.getFullYear(), d.getMonth(), d.getDate()), now = new Date();
    var t = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var diff = Math.round((t - a) / 86400000);
    if (diff === 0) return 'Hôm nay';
    if (diff === 1) return 'Hôm qua';
    return WD[d.getDay()] + ', ' + p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + (d.getFullYear() !== now.getFullYear() ? '/' + d.getFullYear() : '');
  }
  function stamp(d) { return p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + ' ' + hm(d); }

  // ---- Trang thai ----
  var S = {
    dir: GALLERY ? GDIR : (q.get('p') || '/'),
    items: [], sd: null, err: '',
    filter: 'all',              // Thu vien: all | img | vid
    sort: 'date',               // Tep: name | date | size
    sel: null,                  // Set duong dan dang chon (che do chon) hoac null
    shown: 120,                 // so o luoi dang ve (them dan khi cuon)
  };

  function load() {
    return api('/sd/ls?p=' + enc(S.dir)).then(function (r) {
      S.sd = r; S.err = '';
      if (!r.sd) { S.items = []; return; }
      S.items = (r.items || []).map(function (it) { it.k = kindOf(it); it.p = join(S.dir, it.n); it.date = timeOf(it); return it; });
    }).catch(function (e) { S.err = e.message; S.items = []; });
  }
  function visible() {
    var a = S.items.slice();
    if (GALLERY) {
      a = a.filter(function (it) { return (it.k === 'img' || it.k === 'vid') && (S.filter === 'all' || it.k === S.filter); });
      a.sort(function (x, y) { return y.date - x.date; });
    } else {
      a.sort(function (x, y) {
        if (x.d !== y.d) return y.d - x.d;   // thu muc truoc
        if (S.sort === 'size') return y.s - x.s;
        if (S.sort === 'date') return y.date - x.date;
        return x.n.localeCompare(y.n, 'vi', { numeric: true });
      });
    }
    return a;
  }

  // ---- Ve ----
  function render() { renderHeader(); renderMain(); }

  function storagePill() {
    var r = S.sd; if (!r || !r.sd || !r.total_mb) return null;
    var used = r.total_mb - r.free_mb, pct = Math.min(100, Math.round(used * 100 / r.total_mb));
    var p = el('span', 'pill' + (pct > 90 ? ' warn' : ''));
    var b = el('span', 'bar'), i = el('i'); i.style.width = pct + '%'; b.appendChild(i);
    p.append(b, document.createTextNode('Còn ' + size(r.free_mb * 1048576)));
    return p;
  }

  function renderHeader() {
    var h = $('hdr'); h.replaceChildren(); h.className = S.sel ? 'sel' : '';
    if (S.sel) {
      h.append(ib('close', 'Bỏ chọn', function () { S.sel = null; render(); }));
      var t = el('div', 'ttl'); t.append(el('b', '', S.sel.size ? 'Đã chọn ' + S.sel.size : 'Chạm để chọn'));
      h.append(t);
      var all = el('button', 'txtbtn', 'Chọn hết');
      all.onclick = function () { visible().forEach(function (it) { S.sel.add(it.p); }); render(); };
      var del = el('button', 'txtbtn danger', 'Xoá');
      del.disabled = !S.sel.size;
      del.onclick = function () { askDelete(visible().filter(function (it) { return S.sel.has(it.p); })); };
      h.append(all, del);
      return;
    }
    if (FROM_CAMERA) h.append(ib('arrow-left', 'Về Camera', function () { history.back(); }));
    else if (!GALLERY && S.dir !== '/') h.append(ib('arrow-left', 'Lên thư mục trên', function () { history.back(); }));
    var t = el('div', 'ttl');
    var n = visible().length;
    t.append(el('b', '', GALLERY ? 'Thư viện' : (S.dir === '/' ? 'Thẻ SD' : S.dir.split('/').pop())));
    t.append(el('small', '', S.sd && S.sd.sd ? (n + (GALLERY ? (S.filter === 'img' ? ' ảnh' : S.filter === 'vid' ? ' video' : ' ảnh & video') : ' mục')) : ''));
    h.append(t);
    if (S.sd && S.sd.sd) {
      var seg = el('div', 'seg');
      var opts = GALLERY ? [['all', 'Tất cả'], ['img', 'Ảnh'], ['vid', 'Video']] : [['name', 'Tên'], ['date', 'Ngày'], ['size', 'Cỡ']];
      opts.forEach(function (o) {
        var b = el('button', (GALLERY ? S.filter : S.sort) === o[0] ? 'on' : '', o[1]);
        b.onclick = function () { if (GALLERY) S.filter = o[0]; else S.sort = o[0]; S.shown = 120; render(); };
        seg.append(b);
      });
      h.append(seg);
      var pill = storagePill(); if (pill) h.append(pill);
      if (n) { var c = el('button', 'txtbtn', 'Chọn'); c.onclick = function () { S.sel = new Set(); render(); }; h.append(c); }
      if (!GALLERY && S.dir === '/') { var f = el('button', 'txtbtn', 'Định dạng'); f.onclick = askFormat; h.append(f); }
    }
  }

  function emptyState(box) {
    if (S.err) {
      RwvUI.state(box, { kind: 'err', title: 'Không đọc được thẻ SD', text: S.err, retry: refresh });
      return true;
    }
    if (S.fmt === 1 || (S.sd && !S.sd.sd && (S.sd.unformatted || S.sd.fmt === 1))) { formatState(box); return true; }
    if (S.sd && !S.sd.sd) {
      RwvUI.state(box, { kind: 'empty', title: 'Chưa có thẻ SD', text: 'Cắm thẻ nhớ (FAT32) vào khe trên màn hình — tự nhận sau vài giây, không cần khởi động lại.', retry: refresh });
      return true;
    }
    return false;
  }

  function renderMain() {
    var m = $('main'); var top = m.scrollTop; m.replaceChildren();
    if (!S.sd && !S.err) { RwvUI.state(m, { kind: 'loading', title: 'Đang đọc thẻ…' }); return; }
    if (emptyState(m)) return;
    if (!GALLERY) m.append(crumbs());
    var a = visible();
    if (!a.length) {
      var box = el('div'); m.append(box);
      RwvUI.state(box, { kind: 'empty', title: GALLERY ? 'Chưa có ảnh hay video' : 'Thư mục trống',
        text: GALLERY ? 'Ảnh và video chụp bằng ứng dụng Camera sẽ hiện ở đây.' : '' });
      return;
    }
    if (GALLERY) renderGrid(m, a); else renderList(m, a);
    m.scrollTop = top;
  }

  function crumbs() {
    var c = el('div', 'crumbs');
    var parts = S.dir === '/' ? [] : S.dir.slice(1).split('/');
    var mk = function (label, path) { var b = el('button', '', label); b.onclick = function () { if (path !== S.dir) go(path); }; return b; };
    c.append(mk('Thẻ SD', '/'));
    parts.forEach(function (p, i) { c.append(el('span', '', '›'), mk(p, '/' + parts.slice(0, i + 1).join('/'))); });
    return c;
  }

  function renderGrid(m, a) {
    var lastDay = '', grid = null;
    a.slice(0, S.shown).forEach(function (it, idx) {
      var dl = dayLabel(it.date);
      if (dl !== lastDay) { lastDay = dl; m.append(el('div', 'day', dl)); grid = el('div', 'grid'); m.append(grid); }
      var b = el('button', 'tile' + (S.sel && S.sel.has(it.p) ? ' on' : ''));
      var ph = el('div', 'ph'); ph.append(svg(ICON_OF[it.k])); b.append(ph);
      var img = el('img'); img.loading = 'lazy'; img.alt = ''; img.src = thumbUrl(it.p, it);
      img.onerror = function () { img.remove(); };
      b.append(img);
      var meta = el('div', 'meta');
      if (it.k === 'vid') meta.append(svg('play'));
      meta.append(document.createTextNode(hm(it.date) + (it.k === 'vid' ? ' · ' + size(it.s) : '')));
      b.append(meta);
      if (S.sel) { var ck = svg(S.sel.has(it.p) ? 'checkbox-marked-circle' : 'checkbox-blank-circle-outline'); ck.classList.add('ck'); b.append(ck); }
      b.onclick = function () { tap(it, a); };
      longPress(b, it);
      grid.append(b);
    });
    if (a.length > S.shown) {
      var more = el('div', 'more'), mb = el('button', 'txtbtn', 'Xem thêm (' + (a.length - S.shown) + ')');
      mb.onclick = function () { S.shown += 120; renderMain(); }; more.append(mb); m.append(more);
    }
  }

  function renderList(m, a) {
    var list = el('div', 'list');
    a.forEach(function (it) {
      var r = el('button', 'row' + (S.sel && S.sel.has(it.p) ? ' on' : ''));
      var ic = el('div', 'ic ' + it.k); ic.append(svg(ICON_OF[it.k]));
      if (it.k === 'img' || it.k === 'vid') {
        var img = el('img'); img.loading = 'lazy'; img.alt = ''; img.src = thumbUrl(it.p, it);
        img.onload = function () { ic.replaceChildren(img); }; img.onerror = function () { };
      }
      var tx = el('div', 'tx'); tx.append(el('div', 'n', it.n));
      tx.append(el('div', 's', it.d ? 'Thư mục · ' + stamp(it.date) : size(it.s) + ' · ' + stamp(it.date)));
      r.append(ic, tx);
      if (S.sel) { var ck = svg(S.sel.has(it.p) ? 'checkbox-marked-circle' : 'checkbox-blank-circle-outline'); ck.classList.add('ck'); r.append(ck); }
      else if (it.d) r.append(svg('chevron-right'));
      r.onclick = function () { tap(it, a); };
      longPress(r, it);
      list.append(r);
    });
    m.append(list);
  }

  // Giu ~0,6 s: vao che do chon (nhu dien thoai).
  function longPress(node, it) {
    var t = 0, fired = false;
    node.addEventListener('pointerdown', function () { fired = false; t = setTimeout(function () { fired = true; if (!S.sel) S.sel = new Set(); S.sel.add(it.p); render(); }, 600); });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) { node.addEventListener(ev, function () { clearTimeout(t); }); });
    node.addEventListener('click', function (e) { if (fired) { e.stopImmediatePropagation(); e.preventDefault(); fired = false; } }, true);
  }

  function tap(it, list) {
    if (S.sel) { if (S.sel.has(it.p)) S.sel.delete(it.p); else S.sel.add(it.p); render(); return; }
    if (it.d) { go(it.p); return; }
    var media = list.filter(function (x) { return x.k === 'img' || x.k === 'vid' || x.k === 'txt' || x.k === 'aud'; });
    if (media.indexOf(it) < 0) { askInfo(it); return; }
    openViewer(media, media.indexOf(it));
  }

  // ---- Dieu huong (history: nut quay lai he thong) ----
  function go(path) {
    history.pushState({ dir: path }, '', location.pathname + '?' + (GALLERY ? 'view=gallery&' : '') + 'p=' + enc(path));
    S.dir = path; S.sel = null; S.sd = null; render(); load().then(render);
  }
  window.addEventListener('popstate', function (e) {
    var st = e.state || {};
    if (V.open && !st.viewer) { closeViewer(true); return; }
    if (!GALLERY) {
      var d = st.dir || q.get('p') || '/';
      if (d !== S.dir) { S.dir = d; S.sel = null; S.sd = null; render(); load().then(render); }
    }
  });
  history.replaceState({ dir: S.dir }, '');

  function refresh() { return load().then(render); }

  // ---- (01/10/2026) Dinh dang the FAT32 tren chinh panel (the > 32 GB ban ra la exFAT, panel khong doc duoc) ----
  function formatState(box) {
    var busy = S.fmt === 1 || (S.sd && S.sd.fmt === 1);
    var w = el('div', 'rwv-state');
    var ic = el('div', 'ic'); ic.append(svg('sd')); w.append(ic);
    if (busy) {
      w.append(el('div', 't', 'Đang định dạng thẻ…'), el('div', 's', 'Thẻ 64 GB mất khoảng 10–60 giây. Đừng rút thẻ.'));
    } else {
      w.append(el('div', 't', 'Thẻ chưa đúng định dạng'),
        el('div', 's', 'Màn hình đọc được thẻ nhưng thẻ đang ở định dạng khác (thẻ trên 32 GB thường bán ra là exFAT). Định dạng FAT32 ngay tại đây — toàn bộ dữ liệu trên thẻ sẽ bị xoá.'));
      var b = el('button', 'rwv-btn primary', 'Định dạng thẻ (FAT32)'); b.onclick = askFormat; w.append(b);
    }
    box.append(w);
  }
  function askFormat() {
    sheet('Định dạng thẻ nhớ?', 'Thẻ sẽ được định dạng FAT32. MỌI ảnh, video và tệp trên thẻ bị xoá vĩnh viễn.', 'Định dạng', doFormat, true);
  }
  function doFormat() {
    S.fmt = 1; render();
    api('/sd/format?confirm=yes', 'POST').then(function () {
      var t0 = Date.now();
      (function poll() {
        api('/cam/status').then(function (st) {
          if (st.fmt === 1 && Date.now() - t0 < 180000) { setTimeout(poll, 2000); return; }
          S.fmt = 0;
          toast(st.fmt === 2 ? 'Đã định dạng thẻ — dung lượng ' + size(st.sd.total_mb * 1048576) : 'Định dạng không thành công: ' + (st.sd.err || 'lỗi'), 4500);
          if (GALLERY || S.dir !== '/') { S.dir = GALLERY ? GDIR : '/'; }
          refresh();
        }, function () { setTimeout(poll, 3000); });
      })();
    }, function (e) { S.fmt = 0; toast(e.message, 4000); refresh(); });
  }

  // ---- Xoa ----
  function sheet(title, text, okLabel, onOk, danger) {
    var sh = $('sheet'); sh.replaceChildren();
    var box = el('div', 'box'); box.append(el('h2', '', title)); if (text) box.append(el('p', '', text));
    var acts = el('div', 'acts');
    var no = el('button', 'txtbtn', onOk ? 'Huỷ' : 'Đóng'); no.onclick = function () { sh.hidden = true; };
    acts.append(no);
    if (onOk) { var ok = el('button', 'txtbtn' + (danger ? ' danger' : ''), okLabel); ok.onclick = function () { sh.hidden = true; onOk(); }; acts.append(ok); }
    box.append(acts); sh.append(box); sh.hidden = false;
    sh.onclick = function (e) { if (e.target === sh) sh.hidden = true; };
  }
  function askInfo(it) {
    sheet(it.n, size(it.s) + ' · ' + stamp(it.date) + '\nLoại tệp này chưa xem được trên màn hình.', 'Xoá', function () { askDelete([it]); }, true);
  }
  function askDelete(items) {
    if (!items.length) return;
    var dirs = items.filter(function (x) { return x.d; }).length;
    var title = items.length === 1 ? 'Xoá “' + items[0].n + '”?' : 'Xoá ' + items.length + ' mục?';
    var text = (dirs ? 'Thư mục sẽ bị xoá cùng mọi tệp bên trong. ' : '') + 'Không hoàn tác được.';
    sheet(title, text, 'Xoá', function () { doDelete(items); }, true);
  }
  function doDelete(items) {
    var ok = 0, fail = '';
    var chain = Promise.resolve();
    items.forEach(function (it) {
      chain = chain.then(function () { return api('/sd/rm?p=' + enc(it.p), 'POST').then(function () { ok++; }, function (e) { fail = e.message; }); });
    });
    toast('Đang xoá…', 20000);
    return chain.then(function () {
      S.sel = null;
      toast(fail ? ('Đã xoá ' + ok + '/' + items.length + ' — ' + fail) : ('Đã xoá ' + ok + ' mục'), 3200);
      return refresh();
    });
  }

  // ---- Trinh xem anh / video / van ban ----
  var V = { open: false, list: [], i: 0, zoom: 1, tx: 0, ty: 0, hideT: 0, video: null };
  function openViewer(list, i) {
    V.list = list; V.i = i; V.open = true;
    history.pushState({ dir: S.dir, viewer: 1 }, '');
    $('view').hidden = false; show();
  }
  function closeViewer(fromPop) {
    if (V.video) { V.video.pause(); V.video.removeAttribute('src'); V.video.load(); V.video = null; }
    V.open = false; $('view').hidden = true; $('stage').replaceChildren();
    if (!fromPop) history.back();
  }
  function chrome(on) {
    $('view').classList.toggle('bare', !on);
    clearTimeout(V.hideT);
    if (on && V.video && !V.video.paused) V.hideT = setTimeout(function () { chrome(false); }, 3500);
  }
  function step(d) { var j = V.i + d; if (j < 0 || j >= V.list.length) return; V.i = j; show(); }
  function fmt(s) { if (!isFinite(s)) return '--:--'; s = Math.floor(s); return (s >= 3600 ? Math.floor(s / 3600) + ':' : '') + p2(Math.floor(s / 60) % 60) + ':' + p2(s % 60); }

  function show() {
    var it = V.list[V.i], st = $('stage');
    if (V.video) { V.video.pause(); V.video.removeAttribute('src'); V.video.load(); V.video = null; }
    st.replaceChildren(); $('vctl').hidden = true; $('vctl').replaceChildren();
    V.zoom = 1; V.tx = V.ty = 0;
    // Thanh tren
    var top = $('vtop'); top.replaceChildren();
    top.append(ib('arrow-left', 'Đóng', function () { closeViewer(false); }));
    var t = el('div', 'ttl'); t.append(el('b', '', it.n), el('small', '', (V.i + 1) + '/' + V.list.length + ' · ' + stamp(it.date) + ' · ' + size(it.s)));
    top.append(t);
    top.append(ib('delete-outline', 'Xoá', function () {
      sheet('Xoá “' + it.n + '”?', 'Không hoàn tác được.', 'Xoá', function () {
        api('/sd/rm?p=' + enc(it.p), 'POST').then(function () {
          toast('Đã xoá'); V.list.splice(V.i, 1);
          if (!V.list.length) { closeViewer(false); refresh(); return; }
          if (V.i >= V.list.length) V.i = V.list.length - 1;
          show(); load().then(render);
        }, function (e) { toast(e.message, 3500); });
      }, true);
    }));
    $('prev').replaceChildren(svg('chevron-left')); $('next').replaceChildren(svg('chevron-right'));
    $('prev').hidden = V.i === 0; $('next').hidden = V.i === V.list.length - 1;
    chrome(true);

    if (it.k === 'img') {
      var img = el('img'); img.alt = it.n; img.src = fileUrl(it.p); img.draggable = false;
      var wait = el('div', 'vmsg', 'Đang tải ảnh…'); st.append(wait);
      img.onload = function () { wait.remove(); prefetch(); };
      img.onerror = function () { wait.textContent = 'Không mở được ảnh này.'; };
      st.append(img); return;
    }
    if (it.k === 'txt') {
      var pre = el('pre', '', 'Đang tải…'); st.append(pre);
      fetch(fileUrl(it.p), { headers: { Range: 'bytes=0-131071' } }).then(function (r) { return r.text(); })
        .then(function (s) { pre.textContent = s + (it.s > 131072 ? '\n\n… (chỉ hiện 128 KB đầu)' : ''); })
        .catch(function () { pre.textContent = 'Không đọc được tệp.'; });
      return;
    }
    // video / am thanh
    var v = el('video'); v.src = fileUrl(it.p); v.preload = 'auto'; v.autoplay = true; v.playsInline = true;
    V.video = v; st.append(v);
    var big = el('button'); big.id = 'bigplay'; big.setAttribute('aria-label', 'Phát / dừng'); st.append(big);
    var msg = null;
    var ctl = $('vctl'); ctl.hidden = false;
    var pp = ib('pause', 'Phát / dừng', function () { toggle(); });
    var back = ib('rewind-10', 'Lùi 10 giây', function () { v.currentTime = Math.max(0, v.currentTime - 10); chrome(true); });
    var fwd = ib('fast-forward-10', 'Tới 10 giây', function () { v.currentTime = Math.min(v.duration || 1e9, v.currentTime + 10); chrome(true); });
    var cur = el('span', 't', '00:00'), dur = el('span', 't', '--:--');
    var bar = el('input'); bar.type = 'range'; bar.min = 0; bar.max = 1000; bar.value = 0; bar.id = 'seek'; bar.setAttribute('aria-label', 'Tua');
    var vol = ib('volume-high', 'Tắt / bật tiếng', function () { v.muted = !v.muted; vol.replaceChildren(svg(v.muted ? 'volume-off' : 'volume-high')); });
    ctl.append(pp, back, fwd, cur, bar, dur, vol);
    var seeking = false;
    bar.addEventListener('input', function () { seeking = true; if (isFinite(v.duration)) cur.textContent = fmt(bar.value / 1000 * v.duration); chrome(true); });
    bar.addEventListener('change', function () { if (isFinite(v.duration)) v.currentTime = bar.value / 1000 * v.duration; seeking = false; });
    function toggle() { if (v.paused) v.play().catch(function () { }); else v.pause(); }
    big.onclick = function (e) { e.stopPropagation(); toggle(); };
    function sync() {
      var paused = v.paused;
      pp.replaceChildren(svg(paused ? 'play' : 'pause'));
      big.replaceChildren(svg(paused ? 'play' : 'pause')); big.hidden = !paused;
      if (paused) chrome(true);
    }
    v.addEventListener('play', function () { sync(); chrome(true); });
    v.addEventListener('pause', sync);
    v.addEventListener('ended', function () { sync(); });
    v.addEventListener('durationchange', function () { dur.textContent = fmt(v.duration); bar.disabled = !isFinite(v.duration); });
    v.addEventListener('timeupdate', function () {
      cur.textContent = fmt(v.currentTime);
      if (!seeking && isFinite(v.duration) && v.duration > 0) bar.value = Math.round(v.currentTime / v.duration * 1000);
    });
    v.addEventListener('waiting', function () { if (!msg) { msg = el('div', 'vmsg', 'Đang tải…'); st.append(msg); } });
    v.addEventListener('playing', function () { if (msg) { msg.remove(); msg = null; } });
    v.addEventListener('error', function () {
      if (msg) msg.remove(); msg = el('div', 'vmsg', 'Không phát được tệp này trên màn hình.'); st.append(msg); big.hidden = true;
    });
    sync();
  }
  // Tai truoc anh ke tiep (mot tam) — anh 1080p tu the qua WiFi ~1 s.
  function prefetch() { var n = V.list[V.i + 1]; if (n && n.k === 'img') { var i = new Image(); i.src = fileUrl(n.p); } }

  $('prev').onclick = function (e) { e.stopPropagation(); step(-1); };
  $('next').onclick = function (e) { e.stopPropagation(); step(1); };

  // Cu chi tren anh: vuot ngang = ke tiep/truoc, cham = an/hien thanh, cham dup = phong to 2,5x tai diem cham, keo khi
  // dang phong to = di chuyen. Video: cham = an/hien thanh dieu khien.
  (function gestures() {
    var view = $('view'), sx = 0, sy = 0, st0 = 0, moved = false, lastTap = 0, ox = 0, oy = 0, down = false;
    function imgEl() { return $('stage').querySelector('img'); }
    function apply() { var i = imgEl(); if (i) i.style.transform = V.zoom === 1 ? '' : 'translate(' + V.tx + 'px,' + V.ty + 'px) scale(' + V.zoom + ')'; }
    view.addEventListener('pointerdown', function (e) {
      if (e.target.closest('button, input, .vtop, .vctl, pre')) return;
      down = true; sx = e.clientX; sy = e.clientY; st0 = Date.now(); moved = false; ox = V.tx; oy = V.ty;
    });
    view.addEventListener('pointermove', function (e) {
      if (!down) return;
      var dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.abs(dx) > 10 || Math.abs(dy) > 10) moved = true;
      if (V.zoom > 1) { V.tx = ox + dx; V.ty = oy + dy; apply(); }
    });
    view.addEventListener('pointerup', function (e) {
      if (!down) return; down = false;
      var dx = e.clientX - sx, dy = e.clientY - sy, dt = Date.now() - st0;
      if (V.zoom === 1 && moved && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5 && dt < 800) { step(dx < 0 ? 1 : -1); return; }
      if (moved) return;
      var it = V.list[V.i], now = Date.now();
      if (it && it.k === 'img' && now - lastTap < 320) {
        lastTap = 0;
        var i = imgEl(); if (!i) return;
        if (V.zoom === 1) {
          var r = i.getBoundingClientRect(), z = 2.5;
          V.zoom = z; V.tx = r.left - (e.clientX - r.left) * (z - 1); V.ty = r.top - (e.clientY - r.top) * (z - 1);
          // transform-origin 0 0 cua anh nam o goc trai tren cua chinh anh -> doi ve toa do trong anh
          V.tx -= r.left; V.ty -= r.top;
        } else { V.zoom = 1; V.tx = V.ty = 0; }
        apply(); chrome(V.zoom === 1); return;
      }
      lastTap = now;
      setTimeout(function () { if (lastTap === now) chrome($('view').classList.contains('bare')); }, 330);
    });
  })();

  // ---- Khoi dong ----
  render();
  load().then(render);
  // Quay lai ung dung (tab hien lai): doc lai — vua chup anh moi o Camera.
  document.addEventListener('visibilitychange', function () { if (!document.hidden && !V.open && !S.sel) refresh(); });
  // Main cuon gan cuoi: ve them o luoi
  $('main').addEventListener('scroll', function () {
    var m = $('main');
    if (GALLERY && m.scrollTop + m.clientHeight > m.scrollHeight - 400 && visible().length > S.shown) { S.shown += 120; renderMain(); }
  }, { passive: true });
})();
</script>
</body>
</html>
