<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cài đặt</title>
<!-- (26/09/2026 OS-4) Cai dat CUA CHINH MAN HINH NAY: thuc the ESPHome cua thiet bi (tim theo MAC trong HA) + so lieu
     server. Du lieu/ghi qua binding __rwvControl cua tab (server chi nhan tu tab ung dung Cai dat), khong goi HTTP.
     KHONG dung <select> goc: popup cua Chrome headless khong nam trong anh truyen xuong panel.
     (08/10/2026) THIET KE LAI KIEU iOS (nguoi dung yeu cau): man ngang (P4) chia doi nhu iPad — danh sach muc ben trai,
     noi dung ben phai; man vuong / hep (S3) kieu iPhone — danh sach -> trang con (nut "‹ Cài đặt", vuot mep = quay lai qua
     history). Muc lon / nhom con / ten de hieu do server gan (settingsModel.placeSetting, panelPrefs PLACE); o day giu
     ten, icon, mau, thu tu va chu thich. Moi muc lon mot icon vuong bo goc mau rieng; nhom tach bang khoang trong. Lua
     chon ngan = nut phan doan, dai = trang chon co dau tick; sua chu = trang rieng (ban phim ao); khoi dong lai = hop
     xac nhan. Khong hieu ung chay lien tuc (bang thong WiFi). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="ui.css">
<script src="ui.js"></script>
<script src="icons.js"></script>
<style>
  :root {
    --bg: #000; --cell: #1c1c1e; --press: #2c2c2e; --sep: #38383a; --t1: #fff; --t2: #8e8e93; --t3: #5a5a5f;
    --blue: #0a84ff; --green: #30d158; --red: #ff453a; --fill: rgba(118, 118, 128, 0.24); --seg-on: #636366;
    --row: 50px; --ic: 30px; --fs: 17px; --fs-s: 13px; --r: 12px; --px: 16px; --gap-g: 26px;
    color-scheme: dark;
  }
  /* Man nho / vuong (S3 480x480) */
  @media (max-width: 600px) { :root { --row: 46px; --ic: 28px; --fs: 15.5px; --fs-s: 12px; --r: 11px; --px: 14px; --gap-g: 20px; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--t1); overflow: hidden; }
  body.rwv-app { background: var(--bg); font-size: var(--fs); }
  button { font: inherit; color: inherit; border: none; background: none; padding: 0; cursor: pointer; }
  svg { display: block; fill: currentColor; }
  #app { position: fixed; inset: 0; }
  .scroll { overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
  .scroll::-webkit-scrollbar { display: none; }
  /* Bo cuc: chia doi (P4) / mot cot (S3). 28 px tren cung chua cho vien dong ho cua Shell. */
  .split { display: flex; height: 100%; }
  .side { width: 344px; flex: none; height: 100%; padding: 28px 14px 28px 20px; border-right: 1px solid #141416; }
  .detail { flex: 1; min-width: 0; height: 100%; padding: 0 28px 32px; }
  .page { height: 100%; padding: 0 var(--px) 28px; }
  .lt { margin: 6px 4px 14px; font-size: 32px; font-weight: 700; letter-spacing: -0.01em; }
  @media (max-width: 600px) { .lt { font-size: 28px; margin: 32px 2px 12px; } }
  /* Thanh dieu huong cua trang con */
  .nav { position: sticky; top: 0; z-index: 2; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 48px;
    padding-top: 28px; margin-bottom: 4px; background: linear-gradient(var(--bg) 82%, transparent); }
  .nav .nt { font-weight: 600; font-size: calc(var(--fs) + 0.5px); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .nav .nb { justify-self: start; display: inline-flex; align-items: center; gap: 2px; color: var(--blue); font-size: var(--fs); padding: 6px 8px 6px 0; max-width: 100%; }
  .nav .nb svg { width: 26px; height: 26px; margin-left: -6px; flex: none; }
  .nav .nb span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav .nr { justify-self: end; color: var(--blue); font-weight: 600; padding: 6px 0 6px 8px; }
  /* Nhom kieu "inset grouped" */
  .gh { margin: var(--gap-g) var(--px) 7px; font-size: var(--fs-s); color: var(--t2); text-transform: uppercase; letter-spacing: 0.02em; }
  .gh.first { margin-top: 8px; }
  .gsp { height: var(--gap-g); }
  .grp { background: var(--cell); border-radius: var(--r); overflow: hidden; }
  .gf { margin: 7px var(--px) 0; font-size: var(--fs-s); color: var(--t2); line-height: 1.38; }
  .row { position: relative; display: flex; align-items: center; gap: 12px; min-height: var(--row); padding: 7px var(--px); width: 100%; text-align: left; }
  .row + .row::before { content: ''; position: absolute; top: 0; right: 0; left: var(--sl, var(--px)); height: 1px; background: var(--sep); }
  .row.hasic { --sl: calc(var(--px) + var(--ic) + 12px); }
  .row.tap:active, .row.act:active { background: var(--press); }
  .row.col { flex-direction: column; align-items: stretch; gap: 8px; padding-top: 10px; padding-bottom: 12px; }
  .row .top { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .ico { flex: none; width: var(--ic); height: var(--ic); border-radius: calc(var(--ic) * 0.24); display: flex; align-items: center; justify-content: center; color: #fff; }
  .ico svg { width: 68%; height: 68%; }
  .rt { flex: 1; min-width: 0; }
  .rt .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rt .s { margin-top: 2px; font-size: var(--fs-s); color: var(--t2); line-height: 1.32; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .rv { flex: 0 1 auto; max-width: 48%; color: var(--t2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .chev { flex: none; width: 20px; height: 20px; margin-right: -6px; color: var(--t3); }
  .row.off { opacity: 0.4; pointer-events: none; }
  .row.act .t { color: var(--blue); }
  .row.act.danger .t { color: var(--red); }
  .row.act.done .t { color: var(--t2); }
  .tick { flex: none; width: 22px; height: 22px; color: var(--blue); }
  /* The thiet bi (dau danh sach) */
  .row.dev { min-height: 76px; gap: 14px; }
  .row.dev .ico { width: 54px; height: 54px; border-radius: 13px; background: linear-gradient(140deg, #5e5ce6, #0a84ff); }
  .row.dev .t { font-size: calc(var(--fs) + 1px); font-weight: 600; white-space: normal; line-height: 1.22; display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; }
  /* Danh sach ben trai (P4): muc dang chon to xanh, khong mui ten */
  .side .row.sel { background: var(--blue); }
  .side .row.sel .rv, .side .row.sel .s { color: rgba(255, 255, 255, 0.82); }
  .side .row.sel + .row::before, .side .row.sel::before { display: none; }
  /* Cong tac */
  .sw { flex: none; position: relative; width: 51px; height: 31px; border-radius: 16px; background: #39393d; transition: background-color 150ms; }
  .sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3); transition: transform 150ms; }
  .sw.on { background: var(--green); }
  .sw.on::after { transform: translateX(20px); }
  /* Thanh truot */
  .slr { display: flex; align-items: center; gap: 12px; }
  .slr > svg { flex: none; width: 22px; height: 22px; color: var(--t2); }
  .slr > svg.big { width: 26px; height: 26px; }
  .sl { position: relative; flex: 1; height: 34px; touch-action: none; cursor: pointer; }
  .sl .trk { position: absolute; left: 0; right: 0; top: 50%; height: 4px; margin-top: -2px; border-radius: 2px; background: #39393d; overflow: hidden; }
  .sl .fil { position: absolute; left: 0; top: 0; bottom: 0; background: var(--blue); }
  .sl .th { position: absolute; top: 50%; width: 28px; height: 28px; margin: -14px 0 0 -14px; border-radius: 50%; background: #fff;
    box-shadow: 0 0.5px 4px rgba(0, 0, 0, 0.2), 0 6px 13px rgba(0, 0, 0, 0.2); }
  .pbtn { flex: none; color: var(--blue); font-size: var(--fs-s); font-weight: 600; padding: 6px 0 6px 10px; }
  /* Nut phan doan */
  .seg { display: flex; gap: 2px; padding: 2px; border-radius: 9px; background: var(--fill); }
  .seg button { flex: 1 1 0; min-width: 0; height: 30px; padding: 0 10px; border-radius: 7px; font-size: calc(var(--fs) - 3px); font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seg button.on { background: var(--seg-on); font-weight: 600; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2); }
  .seg.inl { flex: none; }
  .seg.inl button { flex: none; padding: 0 14px; }
  /* O nhap chu */
  .field { width: 100%; height: var(--row); padding: 0 var(--px); border: none; outline: none; background: transparent; color: var(--t1);
    font: inherit; caret-color: var(--blue); }
  .nav .nr:disabled { color: var(--t3); }
  .ico.sig { background: transparent; color: var(--blue); }
  .ico.sig svg { width: 92%; height: 92%; }
  .ico.sig.weak { color: var(--t2); }
  /* Hop xac nhan kieu iOS */
  .abg { position: fixed; inset: 0; z-index: 9; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.5); }
  .alert { width: min(300px, 86vw); border-radius: 14px; overflow: hidden; background: #2c2c2e; text-align: center; }
  .alert .at { padding: 19px 16px 3px; font-weight: 600; }
  .alert .am { padding: 2px 18px 18px; font-size: var(--fs-s); line-height: 1.38; color: #d1d1d6; }
  .alert .ab { display: flex; border-top: 1px solid #48484a; }
  .alert .ab button { flex: 1; height: 46px; color: var(--blue); }
  .alert .ab button + button { border-left: 1px solid #48484a; }
  .alert .ab .danger { color: var(--red); font-weight: 600; }
  #note { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 10; max-width: 90vw; padding: 10px 18px; border-radius: 14px;
    background: #3a1d1d; color: #ffd4d1; font-size: var(--fs-s); display: none; }
  .rwv-state { min-height: 100vh; }
</style>
</head>
<body class="rwv-app">
<div id="app"></div>
<div id="note" role="status"></div>
<script>
(function () {
  'use strict';
  var IC = window.RwvIcons || {};
  var app = document.getElementById('app');
  var ctl = function (o) { try { window.__rwvControl(JSON.stringify(o)); } catch (e) { /* */ } };
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function svg(n, cls) {
    var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('aria-hidden', 'true');
    if (cls) s.setAttribute('class', cls);
    var p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('d', IC[n] || ''); s.appendChild(p); return s;
  }
  function set(id, v) { ctl({ settings: 'set', id: id, v: v }); }

  // ── Muc lon: ten, icon, mau (mau he thong iOS ban toi), nhom tren danh sach, thu tu nhom con, chu thich ──
  var CATS = [
    { id: 'net', t: 'Wi-Fi & Mạng', ic: 'wifi', c: '#0a84ff', g: 1, subs: ['Wi-Fi', 'Máy chủ Darboard', 'Đo tốc độ'] },
    { id: 'dnd', t: 'Không làm phiền', ic: 'moon-waning-crescent', c: '#5e5ce6', g: 1, toggle: true },
    { id: 'sound', t: 'Âm thanh', ic: 'volume-high', c: '#ff375f', g: 2, subs: ['Âm lượng', 'Loa'] },
    { id: 'display', t: 'Màn hình & Độ sáng', ic: 'brightness-6', c: '#0a84ff', g: 2, subs: ['Độ sáng', 'Tự tắt màn hình', 'Hướng màn hình'] },
    { id: 'lock', t: 'Màn hình khóa', ic: 'lock', c: '#30d158', g: 2, subs: ['Khóa', 'Hiển thị', 'Widget'] },
    { id: 'wall', t: 'Hình nền & Khung ảnh', ic: 'image-multiple', c: '#64d2ff', g: 2, subs: ['Ảnh nền màn hình khóa', 'Trình chiếu', 'Nguồn ảnh', 'Trên ảnh'] },
    { id: 'voice', t: 'Trợ lý giọng nói', ic: 'microphone', c: '#bf5af2', g: 3, subs: ['Trợ lý', 'Đánh thức', 'Nghe', 'Micro'] },
    { id: 'camera', t: 'Camera & Phát hiện', ic: 'cctv', c: '#40c8e0', g: 3, subs: ['Phát hiện người', 'Khi thấy người', 'Bảo mật luồng camera', 'Trạng thái', 'Âm thanh camera'] },
    { id: 'cast', t: 'Truyền YouTube', ic: 'cast', c: '#ff453a', g: 3, subs: ['YouTube'] },
    { id: 'home', t: 'Màn hình chính', ic: 'home', c: '#ff9f0a', g: 4, subs: ['Trang chủ'] },
    { id: 'battery', t: 'Pin', ic: 'battery', c: '#30d158', g: 4, subs: ['Pin'] },
    { id: 'diag', t: 'Chẩn đoán', ic: 'pulse', c: '#8e8e93', g: 4 },
    { id: 'other', t: 'Khác', ic: 'dots-horizontal', c: '#8e8e93', g: 4, subs: ['Điều khiển', 'Cấu hình'] },
  ];
  var CAT = {}; CATS.forEach(function (c) { CAT[c.id] = c; });
  CAT.about = { id: 'about', t: 'Giới thiệu', ic: 'tablet', c: '#5e5ce6' };
  var FOOT = {
    'net/Máy chủ Darboard': 'Địa chỉ addon HA Darboard mà màn hình kết nối tới (máy:cổng).',
    'display/Tự tắt màn hình': 'Khi bật “Luôn sáng”, màn hình không tắt mà hiện màn hình khóa / chờ lúc rảnh.',
    'lock/Widget': 'Không có số liệu thì widget tự ẩn. Chọn cảm biến năng lượng ở trang Darboard → thẻ Màn khóa.',
    'wall/Nguồn ảnh': 'Thư mục = media/photos của Home Assistant. Album Google Photos dùng chung cho mọi màn hình.',
    'voice/Đánh thức': 'Từ khoá nghe trên chính thiết bị để gọi trợ lý của Home Assistant.',
    'camera/Phát hiện người': 'Dùng để bật sáng màn hình và hiện “Hôm nay” khi có người đứng trước màn hình.',
    'cast/YouTube': 'Mở YouTube trên điện thoại cùng mạng Wi-Fi → nút truyền → chọn tên này.',
    'home/Trang chủ': '“Về trang chủ” mở lại địa chỉ trang chủ trên màn hình này.',
  };
  /** Ten hien cho gia tri lua chon (van gui gia tri goc ve HA). */
  var OPT = { preferred: 'Mặc định (HA)', no_wake_word: 'Không dùng', 'default': 'Mặc định', relaxed: 'Chậm rãi', aggressive: 'Nhanh' };
  function optLabel(it, o) { return /_(xoay_man_hinh|rotation)$/.test(it.id || '') && /^\d+$/.test(o) ? o + '°' : (OPT[o] || o); }

  // ── Trang thai ──
  var last = null, editing = null, touching = false, pendingRender = false, alertOpen = false;
  var split = function () { return innerWidth >= 700 && innerWidth > innerHeight * 1.25; };
  var nav = { cat: null, sub: null, d: 0 };
  try { var sv = JSON.parse(sessionStorage.getItem('rwv_set_nav') || 'null'); if (sv && sv.cat && split()) nav.cat = sv.cat; } catch (e) { /* */ }
  if (history.state && history.state.rwvSet) nav = history.state.nav;
  document.addEventListener('pointerdown', function () { touching = true; }, true);
  var up = function () { touching = false; if (pendingRender) { pendingRender = false; render(last); } };
  document.addEventListener('pointerup', up, true); document.addEventListener('pointercancel', up, true);

  function remember() { try { sessionStorage.setItem('rwv_set_nav', JSON.stringify({ cat: nav.cat })); } catch (e) { /* */ } }
  /** Chuyen trang: push = them muc lich su (vuot mep / nut quay lai cua Shell di ve), khong thi thay muc hien tai. */
  function go(n, push) {
    n.d = push ? (nav.d || 0) + 1 : (nav.d || 0);
    nav = n; remember();
    var st = { rwvSet: 1, nav: n };
    try { if (push) history.pushState(st, ''); else history.replaceState(st, ''); } catch (e) { /* */ }
    editing = null;
    render(last, true);
  }
  function back() {
    if ((nav.d || 0) > 0) { history.back(); return; }
    if (nav.sub) go({ cat: nav.cat, sub: null }, false); else go({ cat: split() ? nav.cat : null, sub: null }, false);
  }
  window.addEventListener('popstate', function (e) {
    var s = e.state;
    nav = s && s.rwvSet ? s.nav : { cat: split() ? nav.cat : null, sub: null, d: 0 };
    editing = null; remember(); render(last, true);
  });

  // ── Dinh dang gia tri ──
  function nf(n, d) { return (d ? n.toFixed(d) : String(Math.round(n))).replace('.', ','); }
  function secText(n) {
    n = Math.round(n);
    if (n >= 86400) { var dd = Math.floor(n / 86400), hh = Math.floor(n % 86400 / 3600); return dd + ' ngày' + (hh ? ' ' + hh + ' giờ' : ''); }
    if (n >= 3600) { var h = Math.floor(n / 3600), mi = Math.floor(n % 3600 / 60); return h + ' giờ' + (mi ? ' ' + mi + ' phút' : ''); }
    if (n < 60) return n + ' giây'; var m = Math.floor(n / 60), s = n % 60; return m + ' phút' + (s ? ' ' + s + ' giây' : '');
  }
  function fmtNum(n, u) {
    if (u === 's') return secText(n);
    var dec = Math.abs(n) >= 100 || Number.isInteger(n) ? 0 : Math.abs(n) >= 10 ? 1 : 2;
    return nf(n, dec) + (u ? (u === '%' ? '%' : ' ' + u) : '');
  }
  function fmtVal(it) {
    var v = it.value, u = it.unit || '';
    if (v == null || v === '' || v === 'unknown' || v === 'unavailable') return '—';
    if (it.kind === 'value' && (v === 'on' || v === 'off')) {
      if (/_ws_connected$/.test(it.id)) return v === 'on' ? 'Đã kết nối' : 'Mất kết nối';
      return v === 'on' ? 'Có' : 'Không';
    }
    var n = Number(v);
    if (String(v).trim() === '' || !isFinite(n)) return String(v) + (u ? ' ' + u : '');
    if (u === 'B') return n >= 1048576 ? nf(n / 1048576, 1) + ' MB' : nf(n / 1024, n < 10240 ? 1 : 0) + ' KB';
    if (u === 'dBm') return nf(n) + ' dBm · ' + (n >= -60 ? 'Tốt' : n >= -70 ? 'Khá' : 'Yếu');
    return fmtNum(n, u);
  }
  function title(it) { return it.title || it.label; }

  // ── Khoi dung ──
  function rowBase(it, cls) { var r = el('div', 'row' + (cls ? ' ' + cls : '')); if (it && it.unavailable) r.classList.add('off'); return r; }
  function textCol(t, s) { var c = el('div', 'rt'); c.append(el('div', 't', t)); if (s) c.append(el('div', 's', s)); return c; }
  function sub(it) { return it.unavailable ? 'Không khả dụng' : (it.hint || ''); }
  function sw(on, fn) {
    var b = el('button', 'sw' + (on ? ' on' : '')); b.type = 'button'; b.setAttribute('role', 'switch'); b.setAttribute('aria-checked', String(!!on));
    b.addEventListener('click', function (e) { e.stopPropagation(); var v = !b.classList.contains('on'); b.classList.toggle('on', v); b.setAttribute('aria-checked', String(v)); fn(v); });
    return b;
  }
  function slider(value, min, max, step, onDone, onShow) {
    var s = el('div', 'sl'), trk = el('div', 'trk'), fil = el('div', 'fil'), th = el('div', 'th');
    trk.append(fil); s.append(trk, th);
    var v = Math.max(min, Math.min(max, Number(value) || 0));
    function show() { var p = max > min ? (v - min) / (max - min) : 0; fil.style.width = (p * 100) + '%'; th.style.left = (p * 100) + '%'; if (onShow) onShow(v); }
    function at(x) {
      var r = s.getBoundingClientRect(), p = Math.max(0, Math.min(1, (x - r.left) / r.width));
      v = Math.round((min + p * (max - min)) / step) * step; v = +Math.max(min, Math.min(max, v)).toFixed(4); show();
    }
    var drag = false;
    s.addEventListener('pointerdown', function (e) { drag = true; try { s.setPointerCapture(e.pointerId); } catch (x) { /* */ } at(e.clientX); });
    s.addEventListener('pointermove', function (e) { if (drag) at(e.clientX); });
    var end = function () { if (!drag) return; drag = false; onDone(v); };
    s.addEventListener('pointerup', end); s.addEventListener('pointercancel', end);
    show();
    return s;
  }
  /** O thanh truot: dong tieu de (+ gia tri ben phai, nut phu) va thanh truot co icon hai dau. */
  function sliderCell(t, s, value, min, max, step, fmt, onDone, icons, extra) {
    var r = el('div', 'row col'), top = el('div', 'top'), val = el('div', 'rv');
    top.append(textCol(t, s), val);
    if (extra) top.append(extra);
    var line = el('div', 'slr');
    var sl = slider(value, min, max, step, onDone, function (v) { val.textContent = fmt(v); });
    if (icons) line.append(svg(icons[0]), sl, svg(icons[1], 'big')); else line.append(sl);
    r.append(top, line);
    return r;
  }
  function segFits(it, opts) {
    var labs = opts.map(function (o) { return optLabel(it, o); });

    var can = !!(w.node && good(w.node.value) && w.scan);
    var g = el('div', 'grp'), r = el('div', 'row hasic');
    r.append(sigIcon(rssi), textCol(cur || 'Wi-Fi', cur ? 'Đã kết nối' + (rssi != null ? ' · ' + rssi + ' dBm · ' + quality(rssi) : '') :
      (rssi != null ? rssi + ' dBm · ' + quality(rssi) : 'Đang kết nối')));
    if (cur) r.append(svg('check', 'tick'));
    g.append(r);
    var st = wifiPending || (w.status && good(w.status.value) ? w.status.value : '');
    if (st) g.append(valueRow('Đổi mạng', '', st));
    out.push(el('div', 'gh' + (out.length ? '' : ' first'), 'Wi-Fi'), g);
    if (can) {
      if (!nav.sub && Date.now() - wifiScanAt > 60000) setTimeout(wifiScan, 0);   // mo trang: quet mot lan / phut
      var nets = parseScan(w.scan.value, cur), g2 = el('div', 'grp');
      nets.slice(0, 12).forEach(function (n) {
        var row = el('button', 'row tap hasic'); row.type = 'button';
        row.append(sigIcon(n.rssi), textCol(n.ssid), el('div', 'rv', n.rssi + ' dBm'), svg('chevron-right', 'chev'));
        row.addEventListener('click', function () { go({ cat: 'net', sub: { k: 'wifi', id: n.ssid } }, true); });
        g2.append(row);
      });
      if (!nets.length) g2.append(valueRow(wifiScanning ? 'Đang tìm mạng…' : 'Chưa thấy mạng nào khác', ''));
      var other = el('button', 'row tap hasic'); other.type = 'button';
      var oi = el('span', 'ico sig'); oi.append(svg('wifi-plus')); other.append(oi, textCol('Mạng khác…'), svg('chevron-right', 'chev'));
      other.addEventListener('click', function () { go({ cat: 'net', sub: { k: 'wifi', id: '' } }, true); });
      g2.append(other);
      g2.append(actionRow(wifiScanning ? 'Đang quét…' : 'Quét lại', false, function () { if (!wifiScanning) { wifiScan(); render(last, true); } }));
      out.push(el('div', 'gh', 'Mạng khác'), g2,
        el('div', 'gf', 'Chọn mạng để kết nối. Màn hình thử trong 30 giây; không vào được hoặc không thấy máy chủ Darboard thì tự quay lại mạng đang dùng.'));
    } else {
      out.push(el('div', 'gf', 'Cập nhật firmware mới để chọn mạng Wi-Fi ngay tại đây.'));
    }
    // Chi tiet: bo dong ten mang + cuong do song (da o tren); doi ten nhom "Wi-Fi" -> "Chi tiết".
    var rest = itemsOf('net').filter(function (i) { return !/_(wifi_ket_noi|ssid|wifi_signal)$/.test(i.id); })
      .map(function (i) { return i.sub === 'Wi-Fi' ? Object.assign({}, i, { sub: 'Chi tiết' }) : i; });
    var saveSubs = CAT.net.subs; CAT.net.subs = ['Chi tiết', 'Máy chủ Darboard', 'Đo tốc độ'];
    var more = groupsFor('net', rest); CAT.net.subs = saveSubs;
    more.forEach(function (n) { if (n.classList && n.classList.contains('first')) n.classList.remove('first'); });
    return out.concat(more);
  }
  // ── (08/10/2026) MAT KHAU LUONG CAMERA (nguoi dung cuoi): firmware luu flash, ap dung ngay; may chu Home Assistant (Darboard,
  // Frigate cai tren HA) khong can mat khau. Trang thai lay tu cam bien "Bật · <ten>" / "Tắt" (khong bao gio co mat khau).
  var camOn = null;
  function camAuthPage(id) {
    var it = findItem(id), cur = it && good(it.value) ? it.value : 'Tắt';
    var curOn = /^Bật/.test(cur), curUser = curOn ? cur.replace(/^Bật\s*·\s*/, '') : '';
    if (camOn == null) camOn = curOn;
    var ok = el('button', 'nr', 'Lưu'); ok.type = 'button';
    var g = el('div', 'grp'), r0 = el('div', 'row');
    r0.append(textCol('Yêu cầu mật khẩu', 'Máy khác trong mạng (VLC, điện thoại…) phải đăng nhập'),
      sw(camOn, function (v) { camOn = v; render(last, true); }));
    g.append(r0);
    var out = [], uIn = null, pIn = null;
    if (camOn) {
      uIn = el('input', 'field'); uIn.type = 'text'; uIn.id = 'cam_user'; uIn.maxLength = 32; uIn.spellcheck = false; uIn.placeholder = 'Tên đăng nhập';
      uIn.value = draft['cam:user'] != null ? draft['cam:user'] : (curUser || 'admin'); uIn.setAttribute('autocomplete', 'off');
      uIn.addEventListener('input', function () { draft['cam:user'] = uIn.value; check(); });
      uIn.addEventListener('focus', function () { editing = 'cam'; });
      pIn = el('input', 'field'); pIn.type = showPw ? 'text' : 'password'; pIn.id = 'cam_pw'; pIn.maxLength = 64; pIn.spellcheck = false;
      pIn.placeholder = curOn ? 'Mật khẩu mới (để trống = giữ mật khẩu cũ)' : 'Mật khẩu (4–64 ký tự)';
      pIn.value = draft['cam:pw'] || ''; pIn.setAttribute('autocomplete', 'off');
      pIn.addEventListener('input', function () { draft['cam:pw'] = pIn.value; check(); });
      pIn.addEventListener('focus', function () { editing = 'cam'; });
      var g2 = el('div', 'grp'), ru = el('div', 'row'), rp = el('div', 'row');
      ru.style.padding = rp.style.padding = '0'; ru.append(uIn); rp.append(pIn); g2.append(ru, rp);
      var g3 = el('div', 'grp'), rs = el('div', 'row');
      rs.append(textCol('Hiện mật khẩu'), sw(showPw, function (v) { showPw = v; pIn.type = v ? 'text' : 'password'; }));
      g3.append(rs);
      out.push(el('div', 'gh', 'Tài khoản'), g2, el('div', 'gsp'), g3);
    }
    function check() {
      if (!camOn) { ok.disabled = !curOn; return; }   // tat: chi luu khi dang bat
      var u = (uIn.value || '').trim(), p = pIn.value || '';
      ok.disabled = !/^[A-Za-z0-9._@-]{1,32}$/.test(u) || (p.length > 0 && p.length < 4) || (!curOn && p.length < 4);
    }
    check();
    function done() { camOn = null; showPw = false; delete draft['cam:user']; delete draft['cam:pw']; editing = null; }
    ok.addEventListener('click', function () {
      ctl({ settings: 'camauth', enabled: camOn, user: camOn ? uIn.value.trim() : curUser, password: camOn ? pIn.value : '' });
      try { if (pIn) pIn.blur(); } catch (e) { /* */ }
      done(); back();
    });
    var ipIt = haItems().filter(function (i) { return /^sensor\..*_(ip|ip_address)$/.test(i.id); })[0];
    var ip = ipIt && good(ipIt.value) ? ipIt.value : '<IP màn hình>';
    var bar = navBar('Huỷ', 'Mật khẩu luồng camera', ok, { plain: true, onBack: done });
    return [bar, el('div', 'gh first', 'Trạng thái: ' + cur), g].concat(out).concat([
      el('div', 'gf', 'Áp dụng ngay cho luồng camera (http://' + ip + ':8080/live) và ứng dụng Camera / thẻ nhớ. Máy chủ Home Assistant ' +
        '(Darboard, Frigate cài trên HA) không cần mật khẩu. Xem bằng VLC: http://<tên>:<mật khẩu>@' + ip + ':8080/live')]);
  }
  var showPw = false;
  function joinPage(ssid) {
    var known = !!ssid, out = [];
    var ok = el('button', 'nr', 'Kết nối'); ok.type = 'button';
    var g = el('div', 'grp'), sIn = null;
    if (!known) {
      sIn = el('input', 'field'); sIn.type = 'text'; sIn.placeholder = 'Tên mạng (SSID)'; sIn.maxLength = 32; sIn.spellcheck = false; sIn.id = 'wifi_ssid';
      sIn.value = draft['wifi:ssid'] || ''; sIn.setAttribute('autocomplete', 'off');
      sIn.addEventListener('input', function () { draft['wifi:ssid'] = sIn.value; check(); });
      sIn.addEventListener('focus', function () { editing = 'wifi'; });
      var r0 = el('div', 'row'); r0.style.padding = '0'; r0.append(sIn); g.append(r0);
    }
    var pw = el('input', 'field'); pw.type = showPw ? 'text' : 'password'; pw.placeholder = 'Mật khẩu (để trống nếu mạng mở)'; pw.maxLength = 63;
    pw.spellcheck = false; pw.id = 'wifi_pw'; pw.value = draft['wifi:pw'] || ''; pw.setAttribute('autocomplete', 'off');
    pw.addEventListener('input', function () { draft['wifi:pw'] = pw.value; check(); });
    pw.addEventListener('focus', function () { editing = 'wifi'; });
    pw.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !ok.disabled) ok.click(); });
    var r1 = el('div', 'row'); r1.style.padding = '0'; r1.append(pw); g.append(r1);
    var g2 = el('div', 'grp'), rs = el('div', 'row');
    rs.append(textCol('Hiện mật khẩu'), sw(showPw, function (v) { showPw = v; pw.type = v ? 'text' : 'password'; }));
    g2.append(rs);
    function check() {
      var s = known ? ssid : (sIn.value || '').trim(), p = pw.value;
      ok.disabled = !s || (p.length > 0 && p.length < 8);
    }
    check();
    ok.addEventListener('click', function () {
      var s = known ? ssid : sIn.value.trim();
      ctl({ settings: 'wifi', op: 'connect', ssid: s, password: pw.value });
      wifiPending = 'Đang kết nối ' + s + '… màn hình có thể ngắt kết nối vài giây.';
      setTimeout(function () { wifiPending = ''; }, 45000);
      delete draft['wifi:pw']; delete draft['wifi:ssid']; editing = null; showPw = false;
      try { pw.blur(); } catch (e) { /* */ }
      back();
    });
    var bar = navBar('Huỷ', known ? ssid : 'Mạng khác', ok, { plain: true, onBack: function () { delete draft['wifi:pw']; delete draft['wifi:ssid']; editing = null; showPw = false; } });
    setTimeout(function () { try { (known ? pw : sIn).focus(); } catch (e) { /* */ } }, 60);
    out.push(bar, el('div', 'gh first', known ? 'Nhập mật khẩu cho “' + ssid + '”' : 'Mạng ẩn hoặc chưa thấy trong danh sách'), g,
      el('div', 'gsp'), g2,
      el('div', 'gf', 'Màn hình thử kết nối trong 30 giây. Không vào được, hoặc vào được nhưng không thấy máy chủ Darboard, thì tự quay lại mạng đang dùng. Trong lúc đổi, màn hình có thể đứng vài giây.'));
    return out;
  }
  function catContent(catId) {
    if (catId === 'net') return netPage();
    if (catId === 'sound') return soundPage();
    if (catId === 'about') return aboutPage();
    if (catId === 'diag') return diagPage();
    return groupsFor(catId, itemsOf(catId));
  }
  function pickPage(it) {
    var g = el('div', 'grp');
    (it.options || []).forEach(function (o) {
      var r = el('button', 'row tap'); r.type = 'button';
      r.append(textCol(optLabel(it, o)));
      if (o === it.value) r.append(svg('check', 'tick'));
      r.addEventListener('click', function () { set(it.id, o); it.value = o; setTimeout(back, 180); render(last, true); });
      g.append(r);
    });
    var out = [el('div', 'gsp'), g];
    if (it.hint) out.push(el('div', 'gf', it.hint));
    return out;
  }
  var draft = {};
  function editPage(it) {
    var g = el('div', 'grp'), inp = el('input', 'field');
    inp.type = 'text'; inp.value = draft[it.id] != null ? draft[it.id] : (it.value || ''); inp.maxLength = it.maxLength || 255; inp.spellcheck = false;
    inp.setAttribute('autocomplete', 'off'); inp.id = 'edit_' + it.id.replace(/[^a-z0-9_]/gi, '_');
    inp.addEventListener('input', function () { draft[it.id] = inp.value; });
    inp.addEventListener('focus', function () { editing = it.id; });
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') save(); });
    g.append(inp);
    function save() { set(it.id, inp.value); delete draft[it.id]; editing = null; try { inp.blur(); } catch (e) { /* */ } back(); }
    editPage.save = save;
    setTimeout(function () { try { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); } catch (e) { /* */ } }, 60);
    var out = [el('div', 'gsp'), g];
    if (it.hint) out.push(el('div', 'gf', it.hint));
    return out;
  }

  // ── Ve ──
  function navBar(backText, t, right, opt) {
    var n = el('div', 'nav');
    if (backText) {
      var b = el('button', 'nb'); b.type = 'button';
      if (!(opt && opt.plain)) b.append(svg('chevron-left'));
      b.append(el('span', '', backText));
      b.addEventListener('click', function () { if (opt && opt.onBack) opt.onBack(); back(); });
      n.append(b);
    } else n.append(el('div'));
    n.append(el('div', 'nt', t || ''));
    if (right) n.append(right); else n.append(el('div'));
    return n;
  }
  function subPage(catId) {
    if (nav.sub.k === 'wifi') return joinPage(nav.sub.id);
    if (nav.sub.k === 'camauth') return camAuthPage(nav.sub.id);
    var it = findItem(nav.sub.id), meta = CAT[catId] || { t: '' };
    if (!it) return null;
    if (nav.sub.k === 'pick') return [navBar(meta.t, title(it))].concat(pickPage(it));
    var saveBtn = el('button', 'nr', 'Lưu'); saveBtn.type = 'button';
    saveBtn.addEventListener('click', function () { if (editPage.save) editPage.save(); });
    return [navBar('Huỷ', title(it), saveBtn, { plain: true, onBack: function () { delete draft[it.id]; editing = null; } })].concat(editPage(it));
  }
  var scrollMem = {};
  function keep(node, key) { if (!node) return; node.dataset.k = key; }
  function saveScroll() { app.querySelectorAll('[data-k]').forEach(function (n) { scrollMem[n.dataset.k] = n.scrollTop; }); }
  function restoreScroll() { app.querySelectorAll('[data-k]').forEach(function (n) { if (scrollMem[n.dataset.k] != null) n.scrollTop = scrollMem[n.dataset.k]; }); }

  function render(d, force) {
    if (!d) return;
    last = d;
    if (alertOpen) return;
    if (editing && !force) return;   // dang go chu: giu nguyen
    if (touching && !force) { pendingRender = true; return; }
    saveScroll();
    var isSplit = split();
    var available = CATS.filter(hasCat).map(function (c) { return c.id; }).concat(['about']);
    if (nav.cat && available.indexOf(nav.cat) < 0) nav.cat = null;
    if (isSplit && !nav.cat) nav.cat = available.indexOf('sound') >= 0 ? 'sound' : available[0];
    if (nav.sub && nav.sub.k !== 'wifi' && nav.sub.k !== 'camauth' && !findItem(nav.sub.id)) nav.sub = null;
    var view;
    if (isSplit) {
      var side = el('div', 'side scroll'), det = el('div', 'detail scroll');
      side.append(el('div', 'lt', 'Cài đặt'));
      rootList(nav.cat).forEach(function (n) { side.append(n); });
      var meta = CAT[nav.cat] || { t: '' };
      var content = nav.sub ? subPage(nav.cat) : null;
      if (!content) content = [navBar('', meta.t)].concat(catContent(nav.cat));
      content.forEach(function (n) { det.append(n); });
      keep(side, 'side'); keep(det, 'det:' + nav.cat + (nav.sub ? ':' + nav.sub.id : ''));
      view = el('div', 'split'); view.append(side, det);
    } else {
      view = el('div', 'page scroll');
      if (!nav.cat) {
        view.append(el('div', 'lt', 'Cài đặt'));
        rootList(null).forEach(function (n) { view.append(n); });
        keep(view, 'root');
      } else {
        var m2 = CAT[nav.cat] || { t: '' };
        var c2 = nav.sub ? subPage(nav.cat) : null;
        if (!c2) c2 = [navBar('Cài đặt', m2.t)].concat(catContent(nav.cat));
        c2.forEach(function (n) { view.append(n); });
        keep(view, 'pg:' + nav.cat + (nav.sub ? ':' + nav.sub.id : ''));
      }
    }
    app.replaceChildren(view);
    restoreScroll();
    if (d.note && !d.note.ok) {
      var n = document.getElementById('note'); n.textContent = d.note.msg; n.style.display = 'block';
      clearTimeout(render.nt); render.nt = setTimeout(function () { n.style.display = 'none'; }, 3500);
    }
  }

  window.addEventListener('rwv-state', function () { if (last && !editing && !touching) render(last); });
  window.addEventListener('resize', function () { if (last) render(last, true); });
  window.__rwvSettings = function (d) { window.__rwvLastSettings = d; render(d); };
  RwvUI.state(app, { kind: 'loading', title: 'Đang đọc cài đặt…' });
  ctl({ settings: 'get' });
  // Cap nhat so lieu 5 s/lan khi trang dang hien (khong dang go chu).
  setInterval(function () { if (document.visibilityState === 'visible' && !editing) ctl({ settings: 'get' }); }, 5000);
})();
</script>
</body>
</html>
