<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0f14">
<title>Control · Darboard</title>
<style>
  :root { color-scheme: dark; --bg:#0b0f14; --line:#1d2733; --txt:#e8eef6; --dim:#93a4b8; --pri:#0ea5e9; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--txt); font:14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    overscroll-behavior:none; -webkit-tap-highlight-color: transparent; }
  body { display:flex; flex-direction:column; height:100dvh; }
  header { display:flex; align-items:center; gap:8px; padding:6px 10px; border-bottom:1px solid var(--line); flex:0 0 auto; }
  header .name { font-weight:600; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header .dot { width:8px; height:8px; border-radius:50%; background:#ef4444; flex:0 0 auto; }
  header .dot.on { background:#22c55e; }
  header .stats { margin-left:auto; color:var(--dim); font-size:11px; font-variant-numeric: tabular-nums; white-space:nowrap; }
  header .btn { border:1px solid var(--line); background:#131b24; color:var(--txt); border-radius:8px; padding:5px 9px; font:inherit; font-size:12px; }
  main { flex:1 1 auto; display:flex; align-items:center; justify-content:center; min-height:0; padding:12px; }
  #stage { position:relative; background:#000; border-radius:10px; overflow:hidden; touch-action:none; user-select:none;
           box-shadow:0 8px 30px rgba(0,0,0,.5); }
  #frame { display:block; width:100%; height:100%; }
  #stage:not(.ready) #frame { opacity:0; }
  #msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; color:var(--dim); padding:16px; font-size:13px; }
  #stage.ready #msg { display:none; }
  #touch { position:absolute; inset:0; touch-action:none; overscroll-behavior:none; -webkit-user-select:none; }
  nav { flex:0 0 auto; display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:8px 10px calc(8px + env(safe-area-inset-bottom));
        border-top:1px solid var(--line); background:#0e141b; }
  nav button { appearance:none; border:1px solid var(--line); background:#151e28; color:var(--txt); border-radius:12px;
               padding:10px 4px; font:inherit; display:flex; flex-direction:column; align-items:center; gap:4px; touch-action:manipulation; }
  nav button:active { background:#1e2a37; transform:scale(.97); }
  nav button svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  nav button span { font-size:11px; color:var(--dim); }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <span class="name" id="name">Đang tải…</span>
  <span class="stats" id="stats"></span>
  <button class="btn" id="bPause">Dừng</button>
</header>
<main>
  <div id="stage"><img id="frame" alt=""><div id="touch"></div><div id="msg">Đang kết nối…</div></div>
</main>
<nav>
  <button id="kBack"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg><span>Trở lại</span></button>
  <button id="kHome"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M3.5 12h.01M20.5 12h.01M12 3.5v.01M12 20.5v.01"/></svg><span>Màn hình chính</span></button>
  <button id="kUnlock"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0"/></svg><span>Mở khoá</span></button>
  <button id="kRecent"><svg viewBox="0 0 24 24"><rect x="4" y="7" width="12" height="12" rx="2"/><path d="M8 5.5h9.5A2.5 2.5 0 0 1 20 8v8.5"/></svg><span>Gần đây</span></button>
</nav>
<script>
(function () {
  var dev = new URLSearchParams(location.search).get('dev') || '';
  var stage = document.getElementById('stage'), img = document.getElementById('frame'),
      touch = document.getElementById('touch'), msg = document.getElementById('msg'),
      dot = document.getElementById('dot'), nameEl = document.getElementById('name'), stats = document.getElementById('stats');
  var W = 0, H = 0, paused = false, frames = 0, fpsAt = 0, fps = 0;
  var pollTimer = 0, pollBusy = false, pollGap = 250;

  if (!dev) { msg.textContent = 'Thiếu ?dev= trên địa chỉ.'; return; }

  function api(path, body, retries) {
    retries = retries || 0;
    var ctl = new AbortController();
    var to = setTimeout(function () { ctl.abort(); }, 4000);
    return fetch(path, body
        ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body), signal: ctl.signal }
        : { signal: ctl.signal })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { code: r.status, j: j }; }); })
      .catch(function () { return { code: 0, err: true }; })
      .finally(function () { clearTimeout(to); });
  }
  function sizeStage() {
    if (!W || !H) return;
    var box = stage.parentElement.getBoundingClientRect();
    var k = Math.min((box.width - 24) / W, (box.height - 24) / H);
    stage.style.width = Math.round(W * k) + 'px';
    stage.style.height = Math.round(H * k) + 'px';
  }
  addEventListener('resize', sizeStage);

  // (22/10/2026) Dem ca 2 chieu: khung NHAN DUOC (rx) va khung VE DUOC (draw). Neu rx cao ma draw thap
  // -> trinh duyet khong ve kip (blob/img); rx thap -> duong truyen/server. Label hien "WS 17/3 fps".
  var rxn = 0, drn = 0, rxAt = 0, drAt = 0, rxFps = 0, drFps = 0, lastDrawAt = 0;
  setInterval(function () {
    var now = performance.now();
    if (!rxAt) rxAt = now; if (!drAt) drAt = now;
    rxFps = Math.round(rxn * 1000 / Math.max(1, now - rxAt)); rxn = 0; rxAt = now;
    drFps = Math.round(drn * 1000 / Math.max(1, now - drAt)); drn = 0; drAt = now;
    var stall = lastDrawAt && now - lastDrawAt > 1500 ? ' · DUNG ' + Math.round((now - lastDrawAt) / 1000) + 's' : '';
    stats.textContent = mode + ' ' + rxFps + '/' + drFps + ' fps' + stall;
    stats.style.color = stall ? '#ff453a' : '';
  }, 1000);

  var got = 0, ws = null, pollTimer = 0, pollBusy = false, mode = '';
  function ready() {
    stage.classList.add('ready'); dot.classList.add('on'); got++;
    drn++; lastDrawAt = performance.now();
  }
  img.onload = function () { if (mode !== 'WS') { if (!W) { W = img.naturalWidth; H = img.naturalHeight; sizeStage(); } ready(); } };
  img.onerror = function () { dot.classList.remove('on'); };

  function showBlob(blob) {
    rxn++;
    var u = URL.createObjectURL(blob);
    img.onload = function () { URL.revokeObjectURL(u); if (!W) { W = img.naturalWidth; H = img.naturalHeight; sizeStage(); } ready(); };
    img.src = u;
  }

  // (22/10/2026) WATCHDOG + TU NOI LAI + TU CHUYEN MJPEG.
  // Do that 22/10: WebSocket qua HA ingress chi song vai khung roi bi dong (log: 4 khung / 0 s, lap lai),
  // trong khi MJPEG qua ingress chay 17,8 fps lien tuc. Nay:
  //  - WS dong khi MOI bat dau (chua du 5 s) -> coi la WS khong dung duoc qua duong nay, chuyen MJPEG luon;
  //  - WS dang chay tot ma dut -> thu noi lai WS (giu khung cu), qua 2 lan van dut thi chuyen MJPEG;
  //  - khong co khung > 1,5 s -> coi nhu treo, xu ly nhu tren.
  var lastFrameAt = 0, reconnectTimer = 0, wsTries = 0, wsAt = 0, wsDrops = 0, preferStream = false, streamTries = 0, wsHb = 0, sseAbort = null, sseTries = 0, sseWatch = 0;
  function scheduleWs(delay) {
    if (paused) return;
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(function () { if (!paused) startWs(); }, delay == null ? 400 : delay);
  }
  function wsFailed() {
    // WS vua dut: neu no moi song duoc < 5 s hoac da dut >= 2 lan -> doi han sang MJPEG.
    wsDrops++;
    if (preferStream || wsDrops >= 2 || performance.now() - wsAt < 5000) { startSse(); return; }
    scheduleWs(300);
  }
  function startWs() {
    if (preferStream) { startSse(); return; }
    mode = 'WS'; clearTimeout(reconnectTimer);
    lastFrameAt = performance.now(); wsAt = lastFrameAt;
    var u = new URL('control/ws?dev=' + encodeURIComponent(dev), location.href);
    u.protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    try { ws = new WebSocket(u.href); } catch (e) { startSse(); return; }
    ws.binaryType = 'arraybuffer';
    ws.onopen = function () {
      wsTries = 0;
      // (22/10/2026) Giữ kết nối WS qua proxy: gửi 1 tin nhắn nhỏ mỗi 2 s.
      clearInterval(wsHb); wsHb = setInterval(function () { try { ws && ws.readyState === 1 && ws.send('p'); } catch (e) {} }, 2000);
    };
    ws.onmessage = function (e) {
      if (e.data && e.data.byteLength) { lastFrameAt = performance.now(); showBlob(new Blob([e.data], { type: 'image/jpeg' })); }
    };
    ws.onerror = function () { };
    ws.onclose = function () {
      if (ws) ws = null;
      if (paused) return;
      wsFailed();
    };
    setTimeout(function () { if (!got) { try { ws && ws.close(); } catch (_) {} } }, 3500);
  }
  setInterval(function () {
    if (paused || mode !== 'WS' || !ws) return;
    if (performance.now() - lastFrameAt > 1500) {
      try { ws.close(); } catch (_) { }
    }
  }, 700);

  function startStream() {
    mode = 'MJPEG'; clearTimeout(reconnectTimer);
    img.onload = function () { if (!W) { W = img.naturalWidth; H = img.naturalHeight; sizeStage(); } ready(); };
    img.onerror = function () {
      dot.classList.remove('on');
      // (22/10/2026) MJPEG dut: thu lai MJPEG (2.9.199 lam vay va on dinh), 2 lan moi xuong polling.
      if (mode !== 'MJPEG') return;
      if (++streamTries <= 1) setTimeout(startStream, 500); else startSse();
    };
    img.src = 'control/stream?dev=' + encodeURIComponent(dev) + '&t=' + Date.now();
    setTimeout(function () { if (got < 2) startPoll(); }, 4000);
  }

  function startSse() {
    mode = 'SSE'; clearTimeout(reconnectTimer); clearTimeout(pollTimer);
    if (sseAbort) { try { sseAbort.abort(); } catch (e) {} }
    sseAbort = new AbortController();
    var buf = '';
    // (22/10/2026) WATCHDOG: neu luong im lang (khong loi/khong dong) > 1,5 s thi tu ngat va noi lai
    // — xu ly truong hop "SSE 0/0 · DUNG n s" do server treo lenh capture.
    var lastSseFrame = performance.now();
    clearInterval(sseWatch);
    sseWatch = setInterval(function () {
      if (mode === 'SSE' && performance.now() - lastSseFrame > 1500) {
        try { sseAbort && sseAbort.abort(); } catch (e) {}
      }
    }, 700);
    fetch('control/sse?dev=' + encodeURIComponent(dev), { signal: sseAbort.signal, cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        var reader = r.body.getReader();
        var dec = new TextDecoder();
        function pump() {
          return reader.read().then(function (x) {
            if (x.done) { if (got < 2) startPoll(); return; }
            buf += dec.decode(x.value, { stream: true });
            var i;
            while ((i = buf.indexOf('\n\n')) >= 0) {
              var ev = buf.slice(0, i); buf = buf.slice(i + 2);
              var m = /data: ([A-Za-z0-9+/=]+)/.exec(ev);
              if (m) {
                lastSseFrame = performance.now();
                try {
                  var bin = atob(m[1]); var arr = new Uint8Array(bin.length);
                  for (var k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
                  showBlob(new Blob([arr], { type: 'image/jpeg' }));
                } catch (e) {}
              }
            }
            return pump();
          });
        }
        return pump();
      })
      .catch(function (e) {
        clearInterval(sseWatch);
        if (e && e.name === 'AbortError') { setTimeout(startSse, 300); return; }
        dot.classList.remove('on');
        if (++sseTries <= 3) setTimeout(startSse, 500); else startPoll();
      });
  }

  function startPoll() {
    mode = 'HTTP'; clearTimeout(pollTimer); pollTimer = 1;
    if (paused) return;
    if (pollBusy) { pollTimer = setTimeout(startPoll, 200); return; }
    pollBusy = true;
    fetch('control/frame?dev=' + encodeURIComponent(dev), { cache: 'no-store' })
      .then(function (r) {
        // (22/10/2026) Hien them header 'server' de biet 429 do ai tra ve (Cloudflare / HA / add-on).
        if (!r.ok) {
          var sv = r.headers.get('server') || r.headers.get('x-powered-by') || '';
          throw new Error('HTTP ' + r.status + (sv ? ' [' + sv + ']' : ''));
        }
        return r.blob();
      })
      .then(function (b) { showBlob(b); })
      .catch(function (e) {
        dot.classList.remove('on');
        // (22/10/2026) 429 = qua nhieu yeu cau (ingress HA chan) -> gian nhip dan, toi da 3 s.
        pollGap = /429/.test(e.message) ? Math.min(3000, pollGap * 2) : 250;
        stats.textContent = 'lỗi: ' + e.message + ' · thử lại sau ' + (pollGap / 1000).toFixed(1) + 's';
      })
      .then(function () { pollBusy = false; pollTimer = setTimeout(startPoll, pollGap); });
  }

  api('screens/info?id=' + encodeURIComponent(dev)).then(function (r) {
    if (r && r.ok) { W = r.screen.w; H = r.screen.h; nameEl.textContent = r.screen.name || dev; if (r.screen.online) dot.classList.add('on'); sizeStage(); }
    else nameEl.textContent = dev;
  }).catch(function () { nameEl.textContent = dev; });

  // (22/10/2026) Do that 22/10: di qua HA ingress thi WebSocket chi song vai khung (ingress dong), con MJPEG
  // thi chay ~18 fps lien tuc. Vao bang ingress -> dung MJPEG luon, khoi mat 1-3 s dau de thu WS.
  // (22/10/2026) Qua HA ingress / ten mien: Cloudflare dem multipart (MJPEG) va dong WebSocket -> dung SSE
  // (text/event-stream) — day la kenh duy nhat Cloudflare stream on dinh. Vao bang IP (LAN/Tailscale) thi WS.
  // (26/10/2026) TU CHUYEN SANG LAN/TAILSCALE: mo bang ten mien -> hoi server IP LAN, probe nhanh;
  // toi duoc thi chuyen sang IP (khi do trang dung WebSocket -> input di qua WS nhu panel that).
  // Neu trang dang HTTPS thi trinh duyet chan probe HTTP (mixed content) -> giu nguyen ten mien.
  (function lanProbe() {
    var h = location.hostname;
    if (/^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|127\.|localhost$)/.test(h)) return;
    if (location.protocol === 'https:') return;
    fetch('control/ping', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j || !j.lan) return null;
        return fetch(j.lan + '/control/ping', { mode: 'no-cors', cache: 'no-store' })
          .then(function () { location.replace(j.lan + location.pathname + location.search); });
      })
      .catch(function () { /* khong toi duoc LAN: giu ten mien */ });
  })();

  if (/[?&]mjpeg/.test(location.search)) {
    preferStream = true; startWs();          // MJPEG (tuong thich cu)
  } else if (location.pathname.indexOf('/api/hassio_ingress/') >= 0) {
    startSse();
  } else {
    startWs();
  }

  // ── Thao tác cham/vuot/keo tha ──────────────────────────────────────────────
  function pt(e) {
    var r = touch.getBoundingClientRect();
    return { x: Math.round((e.clientX - r.left) * W / r.width), y: Math.round((e.clientY - r.top) * H / r.height) };
  }
  // (23/10/2026) GUI NGAY, KHONG CHO (nhu ban 2.9.199 tung chay tot):
  // - down/move/up gui ngay theo thu tu phat; trinh duyet gui dung thu tu nen Chrome nhan dung
  //   touchStart -> touchMove -> touchEnd.
  // - KHONG xep hang doi cho tung lenh: qua Cloudflare moi lenh ~100-250 ms, cho nhau se day
  //   touchEnd ra xa touchStart -> cham 1 lan bi hieu thanh CHAM GIU.
  // - move tiet che 33 ms (khong lu request -> khong 429).
  // (26/10/2026) TRA LAI GUI LIVE tung diem (nhu 2.9.224): keo/vuot phai thay phan hoi NGAY trong luc
  // dang giu tay. Ban gop 1 POST chi gui khi nha tay -> mat cam giac keo thuc te (nguoi dung bao).
  // Chong tre: gui ngay khong cho phan hoi; move tiet che 16 ms (~60 diem/giay).
  // (26/10/2026) KEO LIVE THEO TUNG DOAN 60 ms: van thay phan hoi ngay khi dang keo, nhung gop ~4 diem
  // vao 1 POST (thay vi 1 POST/diem). Ly do: 1 lenh CDP ~26 ms o server + ~200 ms RTT ten mien cong khai;
  // gui 60 request/giay se day hang doi sau hang giay -> giat.
  var acc = null, lastT = 0, lastSend = 0, segStart = 0;
  function wsOpen() { return !!(ws && ws.readyState === 1); }
  function sendWs(kind, p) {
    try { ws.send(JSON.stringify({ t: 'touch', kind: kind, x: p.x, y: p.y })); return true; } catch (e) { return false; }
  }
  function flush(end) {
    if (!acc || acc.length === 0) { acc = null; return; }
    var pts = acc; acc = null;
    api('control/gesture', { dev: dev, points: pts, end: !!end });
    lastSend = Date.now();
  }
  touch.addEventListener('pointerdown', function (e) {
    e.preventDefault(); e.stopPropagation();
    try { touch.setPointerCapture(e.pointerId); } catch (x) { /* ignore */ }
    var p = pt(e);
    lastT = 0; acc = null; segStart = Date.now(); lastSend = 0;
    // (26/10/2026) CO WS -> gui thang qua WS (giong panel that: TouchType qua WS, khong round-trip tung diem).
    // Khong co WS (SSE/tên miền) -> gop doan 60 ms nhu 2.9.234 de giam so request.
    if (wsOpen() && sendWs('down', p)) { lastSend = Date.now(); return; }
    api('control/gesture', { dev: dev, points: [{ x: p.x, y: p.y, t: 0 }], start: true });
    lastSend = Date.now();
  });
  touch.addEventListener('pointermove', function (e) {
    e.preventDefault();
    if (touch.hasPointerCapture && !touch.hasPointerCapture(e.pointerId)) return;
    var now = Date.now(), rel = now - segStart;
    if (rel - lastT < 16) return;
    lastT = rel;
    var p = pt(e);
    if (wsOpen() && sendWs('move', p)) return;
    (acc || (acc = [])).push({ x: p.x, y: p.y, t: rel });
    if (now - lastSend >= 60) flush(false);
  });
  function up(e) {
    if (touch.hasPointerCapture && touch.hasPointerCapture(e.pointerId)) {
      try { touch.releasePointerCapture(e.pointerId); } catch (x) { /* ignore */ }
    }
    var p = pt(e);
    if (wsOpen() && sendWs('up', p)) { acc = null; return; }
    (acc || (acc = [])).push({ x: p.x, y: p.y, t: Date.now() - segStart });
    flush(true);
  }
  touch.addEventListener('pointerup', up);
  touch.addEventListener('pointercancel', up);
  touch.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // 3 phím điều hướng (thay cho vuốt mép — tránh trùng cử chỉ của điện thoại)
  function key(k) { api('control/key', { dev: dev, key: k }); }
  document.getElementById('kHome').onclick = function () { key('home'); };
  document.getElementById('kBack').onclick = function () { key('back'); };
  document.getElementById('kRecent').onclick = function () { key('recents'); };
  document.getElementById('kUnlock').onclick = function () { key('unlock'); };
  // (22/10/2026) Vao trang: nhan 'unlock' 1 lan de man hinh khoi bi che boi man hinh cho (trang trang).
  setTimeout(function () { key('unlock'); }, 1200);
  document.getElementById('bPause').onclick = function () {
    paused = !paused; this.textContent = paused ? 'Xem' : 'Dừng';
    if (paused) { clearTimeout(pollTimer); try { ws && ws.close(); } catch (_) {} try { sseAbort && sseAbort.abort(); } catch (_) {} }
    else { got = 0; startWs(); }
  };
})();
</script>
</body>
</html>
