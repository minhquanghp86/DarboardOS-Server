<!--
  (14/10/2026) UNG DUNG "GỌI" tren man (P4) — cuoc goi video kieu dien thoai (giao dien chung: call-ui.js / call-ui.css).
  ?mode=contacts (mo tu launcher): danh ba -> goi di. ?mode=in&call=&peer=&name= : server mo DE LEN man khoa khi co cuoc goi
  den (src/calls.ts, deviceManager.openRingPage). ?dev= : man nay (server them). Lenh: POST /calls/*; trang thai: hoi
  /calls/state moi 0,7 s. Tieng do server noi truc tiep (mic / loa man); hinh: WS /call/video.
-->
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cuộc gọi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="call-ui.css">
<script src="icons.js"></script>
<script src="call-ui.js"></script>
</head>
<body style="margin:0;background:#0b0d10">
<div id="app"></div>
<script>
(function () {
  'use strict';
  var q = new URLSearchParams(location.search);
  var DEV = q.get('dev') || '', MODE = q.get('mode') || 'contacts';
  var call = q.get('call') || '', peer = q.get('peer') || '', peerName = q.get('name') || '';
  function post(p) {
    return fetch(p, { method: 'POST' }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok || j.ok === false) throw new Error(j.error || 'Lỗi ' + r.status); return j; }); });
  }
  var enc = encodeURIComponent;
  var ui = CallUI.mount(document.getElementById('app'), {
    self: DEV, base: '/', ringUrl: '/ringtone/call',
    contacts: function () { return fetch('/calls/contacts?self=' + enc(DEV), { cache: 'no-store' }).then(function (r) { return r.json(); }); },
    // (02/12/2026) TAB "Nhật ký" / "Thiết bị" tren MAN P4 — cung adapter nhu call-web.html:
    //   GET /calls/log?self=<id man>&limit=50 -> {ok, items:[...]} (moi nhat truoc, xem src/callLog.ts).
    // `self` la id man (server them `?dev=` khi mo trang; trang danh ba mo tu launcher cung co `?dev=`).
    // Bam mot dong nhat ky -> call-ui.js goi A.start(peerId, peerName) = luong goi CO SAN cua man (POST /calls/start).
    // Khong co `?dev=` (mo tay trong trinh duyet) -> danh sach rong, tab van hien (giong call-web.html khi chua `hello`).
    log: function () {
      if (!DEV) return [];
      return fetch('/calls/log?self=' + enc(DEV) + '&limit=50', { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (j) { return (j && j.items) || []; });
    },
    // (02/12/2026) NUT "Xoá nhật ký" (goc phai tieu de tab Nhật ký) -> POST /calls/log/clear?self=<id man>.
    clearLog: function () {
      return post('/calls/log/clear?self=' + enc(DEV));       // post() nem loi khi HTTP loi / `ok:false`
    },
    // (02/12/2026) Man P4 mo trang bang tab "Thiết bị" (danh ba) nhu truoc — tab "Nhật ký" cach 1 lan cham.
    tab: 'devices',
    start: function (to, name) {
      post('/calls/start?from=' + enc(DEV) + '&to=' + enc(to)).then(function (j) {
        call = j.call; peer = to; peerName = name;
        ui.set({ view: 'out', call: call, peer: to, peerName: name });
      }).catch(function (e) { ui.toast(e.message); });
    },
    accept: function () { post('/calls/accept?call=' + enc(call) + '&dev=' + enc(DEV)).catch(function (e) { ui.toast(e.message); }); },
    // (23/11/2026) GD10 — bấm Từ chối / Kết thúc thì ĐÓNG MÀN HÌNH NGAY tại máy này (không chờ nhịp hỏi 0,7 s):
    // trước đây màn hình còn nguyên "đang gọi"/đồng hồ đếm cho tới lần hỏi kế tiếp, và nếu tin trạng thái không về
    // thì treo luôn. Server vẫn được báo để bên kia nhận 'ended' ngay.
    decline: function () { post('/calls/decline?call=' + enc(call)).catch(function () { }); endLocal('Từ chối'); },
    hangup: function () { post('/calls/hangup?call=' + enc(call)).catch(function () { }); endLocal('Đã kết thúc'); },
    mute: function (on) { post('/calls/mute?call=' + enc(call) + '&dev=' + enc(DEV) + '&on=' + (on ? 1 : 0)).catch(function () { }); },
    cam: function (on) { post('/calls/cam?call=' + enc(call) + '&dev=' + enc(DEV) + '&on=' + (on ? 1 : 0)).catch(function () { }); },
    // Hinh cua minh: camera man nay (luong /live chia — khong ton them ket noi toi P4).
    selfVideo: function (t) { t.video.hidden = true; t.canvas.hidden = false; return CallUI.videoInto(t.canvas, '/call/video?dev=' + enc(DEV)); },
  });
  // (23/11/2026) GD10 — đóng cuộc gọi NGAY (dùng chung cho "bấm nút" và "server báo đã kết thúc").
  // Trang này do server mở làm chuông (mode=in) thì server tự đóng (closeDoorbell); trang danh bạ (mode=contacts)
  // thì về lại danh bạ sau 0,7 s — trước đây 2,5 s, và nếu không bấm gì thì màn hình còn nguyên đồng hồ.
  var endT = 0;
  function endLocal(reason) {
    clearTimeout(endT);
    call = '';
    ui.set({ view: 'ended', reason: reason || 'Đã kết thúc' });
    endT = setTimeout(function () { if (!call && MODE === 'contacts') ui.set({ view: 'contacts', call: '' }); }, 700);
  }
  // Hoi trang thai khi co cuoc goi.
  setInterval(function () {
    if (!call) return;
    fetch('/calls/state?call=' + enc(call), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (s) {
      if (s.state === 'ended') { endLocal(s.reason); return; }
      if (s.state === 'active') {
        var p = s.from === DEV ? s.to : s.from;
        ui.set({ view: 'active', call: call, peer: p, peerName: s.from === DEV ? s.toName : s.fromName, since: s.since,
          peerMuted: s.muted.indexOf(p) >= 0, peerCamOff: s.camOff.indexOf(p) >= 0 });
      }
    }).catch(function () { });
  }, 700);
  if (MODE === 'in' && call) ui.set({ view: 'in', call: call, peer: peer, peerName: peerName });
  else ui.set({ view: 'contacts' });
})();
</script>
</body>
</html>
