<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Camera</title>
<!--
  (01/10/2026) UNG DUNG CAMERA cua panel (chi man co camera — P4). Xem truc tiep luong go2rtc cua chinh panel (MSE, nhu
  cam.html), chup anh 1920x1080 / quay video H.264 (.mkv) luu the SD cua panel, thu vien xem / xoa. Moi lenh qua
  /api/cam/* cua server -> firmware cam_app (src/camProxy.ts). Khong co the SD: van chup duoc, anh chi xem tam.
  Tham so: src (luong go2rtc, mac dinh p4_panel), host (go2rtc, mac dinh 192.168.1.2:1984).
-->
<link rel="stylesheet" href="/ui.css">
<style>
  :root { --accent: #22c55e; --rec: #ef4444; }
  html, body { height: 100%; overflow: hidden; background: #000; }
  #live, #live video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  #live .info { display: none !important; }
  #wait { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; color: var(--muted); font-size: 15px; }
  #wait[hidden] { display: none; }

  /* Cot dieu khien ben phai (nhu camera dien thoai de ngang) */
  .bar { position: fixed; top: 0; right: 0; bottom: 0; width: clamp(96px, 15vw, 150px); display: flex; flex-direction: column;
    align-items: center; justify-content: space-between; padding: clamp(14px, 4vh, 28px) 0;
    background: linear-gradient(to left, rgba(0,0,0,.62), rgba(0,0,0,0)); }
  .thumb { width: clamp(48px, 8.5vmin, 64px); height: clamp(48px, 8.5vmin, 64px); border-radius: 12px; border: 2px solid rgba(255,255,255,.85);
    background: #1f2937 center / cover no-repeat; color: var(--muted); display: flex; align-items: center; justify-content: center;
    font-size: 11px; cursor: pointer; padding: 0; }
  .shutter { width: clamp(68px, 14vmin, 92px); height: clamp(68px, 14vmin, 92px); border-radius: 50%; border: 5px solid #fff;
    background: rgba(255,255,255,.22); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  .shutter .core { width: 74%; height: 74%; border-radius: 50%; background: #fff; transition: all .18s; }
  .shutter.video .core { background: var(--rec); }
  .shutter.recording .core { width: 40%; height: 40%; border-radius: 8px; background: var(--rec); }
  .shutter:disabled { opacity: .5; }
  .modes { display: flex; flex-direction: column; gap: 6px; }
  .modes button { font: inherit; font-weight: 700; font-size: 13px; letter-spacing: .3px; color: rgba(255,255,255,.7); background: none;
    border: none; padding: 6px 10px; border-radius: 999px; cursor: pointer; }
  .modes button.on { color: #111; background: #facc15; }

  /* Trang thai goc tren trai */
  .top { position: fixed; top: clamp(10px, 2.5vh, 18px); left: clamp(10px, 2vw, 18px); display: flex; gap: 8px; flex-wrap: wrap;
    align-items: center; right: clamp(110px, 17vw, 170px); }
  .chip { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600;
    background: rgba(0,0,0,.55); color: #e5e7eb; font-variant-numeric: tabular-nums; }
  .chip.warn { color: #fde68a; }
  .chip.rec { background: rgba(239,68,68,.92); color: #fff; }
  .chip.rec::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #fff; }
  .chip[hidden] { display: none; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .25s; }
  #toast { position: fixed; left: 50%; bottom: clamp(16px, 5vh, 30px); transform: translateX(-50%); background: rgba(17,24,39,.92);
    color: #f9fafb; padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 600; max-width: 70vw; text-align: center; }
  #toast[hidden] { display: none; }

  /* Thu vien */
  #gal { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; }
  #gal[hidden] { display: none; }
  .ghead { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .ghead h1 { font-size: 18px; margin: 0; flex: 1; }
  .ghead .sub { color: var(--muted); font-size: 13px; font-weight: 500; }
  .grid { flex: 1; overflow-y: auto; padding: 12px 16px 24px; display: grid; gap: 10px;
    grid-template-columns: repeat(auto-fill, minmax(clamp(120px, 20vw, 190px), 1fr)); align-content: start; }
  .tile { position: relative; aspect-ratio: 16 / 9; border-radius: var(--r-md); overflow: hidden; background: var(--surface-2) center / cover no-repeat;
    border: none; padding: 0; cursor: pointer; color: var(--text); max-width: 100%; }
  .tile .lbl { position: absolute; left: 0; right: 0; bottom: 0; padding: 4px 8px; font-size: 11px; text-align: left;
    background: linear-gradient(to top, rgba(0,0,0,.75), rgba(0,0,0,0)); font-variant-numeric: tabular-nums; }
  .tile .vid { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 30px; }
  .empty { grid-column: 1 / -1; color: var(--muted); text-align: center; padding: 40px 10px; font-size: 15px; line-height: 1.6; }
  #view { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; }
  #view[hidden] { display: none; }
  #view img, #view video { max-width: 100%; max-height: 100%; }
  .vbar { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; gap: 10px; align-items: center; }
  .vbar .name { flex: 1; color: #e5e7eb; font-size: 13px; text-shadow: 0 1px 2px #000; }
  .rwv-btn.danger { background: var(--err); color: #fff; }
</style>
</head>
<body class="rwv-app">
<div id="live"></div>
<div id="wait"><div class="nhan">Đang mở camera…</div></div>
<div id="flash"></div>

<div class="top">
  <span class="chip rec" id="recChip" hidden>00:00</span>
  <span class="chip" id="sdChip">Đang kiểm tra thẻ SD…</span>
</div>

<div class="bar">
  <button class="thumb" id="thumb" aria-label="Thư viện">Thư viện</button>
  <button class="shutter" id="shutter" aria-label="Chụp ảnh"><span class="core"></span></button>
  <div class="modes" role="radiogroup" aria-label="Chế độ">
    <button id="mPhoto" class="on" role="radio" aria-checked="true">ẢNH</button>
    <button id="mVideo" role="radio" aria-checked="false">VIDEO</button>
  </div>
</div>
<div id="toast" hidden></div>

<div id="gal" hidden>
  <div class="ghead">
    <button class="rwv-btn" id="galBack">‹ Camera</button>
    <h1>Thư viện <span class="sub" id="galSub"></span></h1>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div id="view" hidden>
  <div class="vbar">
    <button class="rwv-btn" id="viewBack">‹ Thư viện</button>
    <span class="name" id="viewName"></span>
    <button class="rwv-btn danger" id="viewDel">Xoá</button>
  </div>
</div>

<script type="module">
  const q = new URLSearchParams(location.search);
  const src = q.get('src') || 'p4_panel';
  const host = q.get('host') || '192.168.1.2:1984';
  const $ = (id) => document.getElementById(id);
  const api = (p, method = 'GET') => fetch('/api/cam' + p, { method, cache: 'no-store' }).then(async (r) => {
    let j = null; try { j = await r.json(); } catch { /* */ }
    if (!r.ok) throw new Error((j && (j.err || j.error)) || ('HTTP ' + r.status));
    return j;
  });
  let mode = 'photo', st = null, busy = false, toastT = 0;

  function toast(msg, ms = 2600) {
    const t = $('toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, ms);
  }
  const mmss = (s) => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  const gb = (mb) => (mb / 1024).toLocaleString('vi-VN', { maximumFractionDigits: 1 });

  // ---- Xem truc tiep (MSE qua go2rtc, nhu cam.html) ----
  import(`http://${host}/video-stream.js`)
    .then(() => customElements.whenDefined('video-stream'))
    .then(() => {
      const v = document.createElement('video-stream');
      v.background = true; v.mode = 'mse';
      v.src = new URL(`api/ws?src=${encodeURIComponent(src)}`, `http://${host}/`);
      $('live').appendChild(v);
      (function doi() {
        const vid = v.querySelector('video') || (v.shadowRoot && v.shadowRoot.querySelector('video'));
        if (vid && vid.videoWidth > 0) { $('wait').hidden = true; return; }
        requestAnimationFrame(doi);
      })();
    })
    .catch(() => { $('wait').firstElementChild.textContent = 'Không mở được hình trực tiếp (go2rtc).'; });

  // ---- Trang thai (the SD, dang quay, anh cuoi) ----
  function render() {
    if (!st) return;
    const sd = $('sdChip');
    if (st.sd.ok) { sd.textContent = `Thẻ SD · còn ${gb(st.sd.free_mb)} GB`; sd.classList.remove('warn'); }
    else { sd.textContent = 'Chưa có thẻ SD — ảnh chỉ xem tạm'; sd.classList.add('warn'); }
    const rec = st.rec.on;
    $('recChip').hidden = !rec;
    if (rec) $('recChip').textContent = mmss(st.rec.s);
    const sh = $('shutter');
    sh.classList.toggle('video', mode === 'video');
    sh.classList.toggle('recording', rec);
    sh.setAttribute('aria-label', mode === 'photo' ? 'Chụp ảnh' : rec ? 'Dừng quay' : 'Quay video');
    $('mPhoto').disabled = $('mVideo').disabled = rec;
  }
  let thumbName = '';
  async function poll() {
    try {
      st = await api('/cam/status'); render();
      // Anh chup gan nhat (ke ca chup tu lan mo truoc) -> o Thu vien.
      if (st.last && st.last.name && st.last.name !== thumbName) { thumbName = st.last.name; setThumb('/api/cam/cam/last.jpg?n=' + encodeURIComponent(thumbName)); }
    }
    catch (e) { $('sdChip').textContent = 'Camera chưa sẵn sàng: ' + e.message; $('sdChip').classList.add('warn'); }
  }
  poll(); setInterval(() => { if (!document.hidden) poll(); }, 2000);

  function setThumb(url) { const t = $('thumb'); t.style.backgroundImage = `url("${url}")`; t.textContent = ''; }

  function setMode(m) {
    if (st && st.rec.on) return;
    mode = m;
    for (const [id, on] of [['mPhoto', m === 'photo'], ['mVideo', m === 'video']]) { $(id).classList.toggle('on', on); $(id).setAttribute('aria-checked', String(on)); }
    render();
  }
  $('mPhoto').onclick = () => setMode('photo');
  $('mVideo').onclick = () => setMode('video');

  $('shutter').onclick = async () => {
    if (busy) return;
    busy = true; $('shutter').disabled = true;
    try {
      if (mode === 'photo') {
        $('flash').style.opacity = '0.85'; setTimeout(() => { $('flash').style.opacity = '0'; }, 120);
        const r = await api('/cam/photo', 'POST');
        setThumb('/api/cam/cam/last.jpg?t=' + Date.now());
        toast(r.last && r.last.saved ? `Đã lưu ${r.last.name}` : 'Đã chụp (chưa có thẻ SD — chưa lưu)');
      } else if (st && st.rec.on) {
        await api('/cam/rec?on=0', 'POST'); toast('Đã dừng quay, đang lưu…');
      } else {
        await api('/cam/rec?on=1', 'POST'); toast('Đang quay');
      }
    } catch (e) { toast(e.message, 3500); }
    busy = false; $('shutter').disabled = false; poll();
  };

  // ---- Thu vien ----
  async function openGallery() {
    $('gal').hidden = false;
    const grid = $('grid'); grid.replaceChildren();
    let r;
    try { r = await api('/sd/list'); } catch (e) { r = { sd: false, files: [], err: e.message }; }
    if (!r.sd) {
      const d = document.createElement('div'); d.className = 'empty';
      d.textContent = 'Chưa có thẻ SD. Cắm thẻ (FAT32) vào khe trên màn hình — camera tự nhận, không cần khởi động lại.';
      grid.append(d); $('galSub').textContent = ''; return;
    }
    $('galSub').textContent = `· ${r.files.length} tệp`;
    if (!r.files.length) { const d = document.createElement('div'); d.className = 'empty'; d.textContent = 'Chưa có ảnh hay video nào.'; grid.append(d); return; }
    for (const f of r.files) {
      const b = document.createElement('button'); b.className = 'tile';
      const isImg = /\.jpg$/i.test(f.n);
      if (isImg) b.style.backgroundImage = `url("/api/cam/sd/file?n=${encodeURIComponent(f.n)}")`;
      else { const v = document.createElement('div'); v.className = 'vid'; v.textContent = '▶'; b.append(v); }
      const l = document.createElement('div'); l.className = 'lbl';
      l.textContent = f.n.replace(/^(IMG|VID)_/, '').replace(/\.(jpg|mkv)$/i, '').replace(/^(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})(\d{2})$/, '$3/$2 $4:$5') + ` · ${f.kb >= 1024 ? (f.kb / 1024).toFixed(1) + ' MB' : f.kb + ' KB'}`;
      b.append(l);
      b.onclick = () => openView(f.n, isImg);
      grid.append(b);
    }
  }
  $('thumb').onclick = openGallery;
  $('galBack').onclick = () => { $('gal').hidden = true; };

  let viewing = null, delArmed = false;
  function openView(name, isImg) {
    viewing = name; delArmed = false; $('viewDel').textContent = 'Xoá';
    const v = $('view'); v.querySelectorAll('img,video').forEach((x) => x.remove());
    const url = `/api/cam/sd/file?n=${encodeURIComponent(name)}`;
    const el = document.createElement(isImg ? 'img' : 'video');
    el.src = url;
    if (!isImg) { el.controls = true; el.autoplay = true; el.onerror = () => toast('Trình duyệt không phát được tệp này — chép ra máy tính để xem.', 4000); }
    v.append(el); $('viewName').textContent = name; v.hidden = false;
  }
  $('viewBack').onclick = () => { $('view').hidden = true; $('view').querySelectorAll('video').forEach((x) => x.pause()); };
  $('viewDel').onclick = async () => {
    if (!delArmed) { delArmed = true; $('viewDel').textContent = 'Chạm lần nữa để xoá'; return; }
    try { await api('/sd/del?n=' + encodeURIComponent(viewing), 'POST'); toast('Đã xoá ' + viewing); $('view').hidden = true; openGallery(); }
    catch (e) { toast(e.message, 3500); }
  };
</script>
</body>
</html>
