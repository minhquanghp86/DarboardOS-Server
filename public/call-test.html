<!doctype html>
<!--
  (14/10/2026) INTERCOM GIAI DOAN 0 — trang THU tieng hai chieu giua trinh duyet (mo qua ingress Darboard, HTTPS) va mot
  man co mic cuoc goi. Chi tieng (chua co hinh). Mic trinh duyet -> 16 kHz mono s16le, khung 20 ms -> WS /call/ws ->
  server -> loa man (AudioFrame). Mic man (da khu vong) -> server -> WS -> loa trinh duyet. src/callBridge.ts.
-->
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thử gọi</title>
<link rel="stylesheet" href="ui.css">
<style>
  :root { --accent: #16a34a; }
  body { padding: 20px; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; font-size: 16px; }
  h1 { margin: 0; font-size: 22px; }
  .muted { color: var(--muted); font-size: 14px; line-height: 1.45; }
  select, button { font: inherit; }
  select { height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--text); }
  .row { display: flex; gap: 10px; align-items: center; }
  .rwv-btn.end { background: var(--err); color: #fff; }
  .meter { flex: 1; height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; background: var(--accent); }
  .lbl { width: 92px; font-size: 14px; color: var(--muted); }
  #st { font-weight: 600; }
</style>
</head>
<body class="rwv-app">
  <a href="./" style="color:var(--muted);text-decoration:none;font-size:14px">← Darboard</a>
  <h1>Thử gọi tới màn</h1>
  <div class="muted">Giai đoạn 0 của Liên lạc: chỉ có tiếng hai chiều. Nên dùng tai nghe để tránh tiếng vọng từ máy bạn.</div>
  <div class="row"><select id="dev" aria-label="Màn"></select><button class="rwv-btn primary" id="go" type="button">Gọi</button></div>
  <div id="st" role="status">Chưa gọi</div>
  <div class="row"><span class="lbl">Mic của bạn</span><div class="meter"><i id="mIn"></i></div></div>
  <div class="row"><span class="lbl">Tiếng từ màn</span><div class="meter"><i id="mOut"></i></div></div>
  <div class="muted" id="info"></div>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var BASE = location.pathname.replace(/[^/]*$/, '');
  var ws = null, ctx = null, stream = null, node = null, playNode = null, t0 = 0, rx = 0, tx = 0, infoT = 0;
  function st(t) { $('st').textContent = t; }
  function loadDevs() {
    fetch(BASE + 'call/devices', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (l) {
      var s = $('dev'); s.replaceChildren();
      if (!l.length) { var o = document.createElement('option'); o.textContent = 'Không có màn nào gọi được'; s.append(o); $('go').disabled = true; return; }
      l.forEach(function (d) { var o = document.createElement('option'); o.value = d.id; o.textContent = d.id + ' (' + d.w + '×' + d.h + ')' + (d.busy ? ' — đang bận' : ''); s.append(o); });
      $('go').disabled = false;
    }).catch(function (e) { st('Không đọc được danh sách màn: ' + e.message); });
  }
  // AudioWorklet: thu mic -> 16 kHz s16le 20 ms; phat PCM 16 kHz nhan ve (bo dem toi da 300 ms).
  var WORKLET = [
    "class Cap extends AudioWorkletProcessor{constructor(){super();this.r=sampleRate/16000;this.acc=0;this.buf=new Int16Array(320);this.n=0;this.lv=0}",
    "process(i){const c=i[0]&&i[0][0];if(!c)return true;for(let k=0;k<c.length;k++){this.acc+=1;if(this.acc>=this.r){this.acc-=this.r;const v=Math.max(-1,Math.min(1,c[k]));",
    "this.buf[this.n++]=v*32767;this.lv=Math.max(this.lv,Math.abs(v));if(this.n===320){this.port.postMessage({pcm:this.buf.buffer.slice(0),lv:this.lv});this.n=0;this.lv=0}}}return true}}",
    "registerProcessor('cap',Cap);",
    "class Play extends AudioWorkletProcessor{constructor(){super();this.q=[];this.cur=null;this.pos=0;this.r=16000/sampleRate;this.f=0;",
    "this.port.onmessage=e=>{this.q.push(new Int16Array(e.data));let tot=0;for(const b of this.q)tot+=b.length;while(tot>4800&&this.q.length>1){tot-=this.q.shift().length}}}",
    "process(i,o){const out=o[0][0];for(let k=0;k<out.length;k++){if(!this.cur||this.pos>=this.cur.length){this.cur=this.q.shift()||null;this.pos=0}",
    "if(!this.cur){out[k]=0;continue}out[k]=this.cur[Math.floor(this.pos)]/32768;this.f+=this.r;while(this.f>=1){this.f-=1;this.pos++}}return true}}",
    "registerProcessor('play',Play);"].join('\n');
  function start() {
    var dev = $('dev').value; if (!dev) return;
    st('Đang xin quyền micro…');
    navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } }).then(function (s) {
      stream = s; ctx = new AudioContext();
      return ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: 'text/javascript' })));
    }).then(function () {
      node = new AudioWorkletNode(ctx, 'cap'); playNode = new AudioWorkletNode(ctx, 'play', { outputChannelCount: [1] });
      ctx.createMediaStreamSource(stream).connect(node); playNode.connect(ctx.destination);
      var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(proto + '//' + location.host + BASE + 'call/ws?dev=' + encodeURIComponent(dev)); ws.binaryType = 'arraybuffer';
      st('Đang kết nối…');
      ws.onopen = function () { t0 = Date.now(); st('Đang gọi ' + dev); $('go').textContent = 'Kết thúc'; $('go').classList.add('end'); };
      ws.onmessage = function (e) {
        if (!(e.data instanceof ArrayBuffer)) return; rx++;
        var a = new Int16Array(e.data), m = 0; for (var k = 0; k < a.length; k += 4) m = Math.max(m, Math.abs(a[k]));
        $('mOut').style.width = Math.round(m / 327.68) + '%';
        playNode.port.postMessage(e.data, [e.data]);
      };
      ws.onclose = function (e) { stop(e.reason ? 'Đã kết thúc: ' + e.reason : 'Đã kết thúc'); };
      node.port.onmessage = function (e) {
        $('mIn').style.width = Math.round(e.data.lv * 100) + '%';
        if (ws && ws.readyState === 1 && ws.bufferedAmount < 32000) { ws.send(e.data.pcm); tx++; }
      };
      infoT = setInterval(function () { var s = Math.max(1, (Date.now() - t0) / 1000); $('info').textContent = 'Gửi ' + tx + ' gói (' + Math.round(tx / s) + '/s), nhận ' + rx + ' gói (' + Math.round(rx / s) + '/s; đủ = 50/s)'; }, 1000);
    }).catch(function (e) { stop('Không bắt đầu được: ' + e.message + (location.protocol !== 'https:' ? ' (cần HTTPS)' : '')); });
  }
  function stop(msg) {
    clearInterval(infoT);
    if (ws) { try { ws.close(); } catch (e) { /* */ } ws = null; }
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    if (ctx) { ctx.close(); ctx = null; }
    $('go').textContent = 'Gọi'; $('go').classList.remove('end'); $('mIn').style.width = '0';
    st(msg || 'Chưa gọi'); loadDevs();
  }
  $('go').onclick = function () { if (ws) stop(); else start(); };
  loadDevs();
})();
</script>
</body>
</html>
