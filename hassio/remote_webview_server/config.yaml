name: "Remote WebView Server"
version: "2.9.138"
slug: "remote_webview_server"
# (02/10/2026) Anh dung san tren ghcr (CI tag = version). Truoc day addon build tai may HA tu build.yaml + Dockerfile,
# va Supervisor xuat ca anh Docker (~1,1 GB sau nen) vao moi ban sao luu; anh keo ve thi khong. build.yaml/Dockerfile
# giu lai lam cong thuc cho CI (.github/workflows/release-docker.yml, buoc "Build & Push addon image").
image: "ghcr.io/minhquanghp86/ha-darboard-server"
description: "Truyền bảng điều khiển HA hoặc bất kỳ trang web nào tới màn hình hiển thị dựa trên ESP32 dưới dạng ô thông qua WebSocket."
url: "https://github.com/minhquanghp86/HA-Darboard-Server/tree/main/hassio/remote_webview_server"
# Chi amd64: image dua tren Google Chrome (H.264) — Chrome cho Linux chi co ban amd64.
arch:
  - amd64
startup: application
boot: auto

host_network: true
# (25/09/2026) Doc vi tri nha (/api/config) cho ung dung Thoi tiet cua launcher — xem src/haLocation.ts.
homeassistant_api: true
# (25/09/2026) Trang "Menu panel" tren thanh ben HA: cau hinh menu ung dung cua panel (an/hien, thu tu, bieu tuong MDI,
# mau, them ung dung). Ingress buoc dang nhap HA; server chi cho LUU tu dia chi ingress (src/launcherApi.ts).
ingress: true
ingress_port: 18080
ingress_entry: launcher-config.html
# (01/10/2026) Trang thanh ben gio co hai the: Tin nhan (noi bo voi cac man hinh) + Menu ung dung -> ten "Darboard".
panel_icon: mdi:tablet-dashboard
panel_title: Darboard

video: true
udev: true
init: false

watchdog: "http://[HOST]:[PORT:18080]/"

map:
  - type: addon_config
    read_only: false
  # (27/09/2026) Ung dung Khung anh doc anh trong thu muc media cua HA (/media/photos) — chi doc.
  - type: media
    read_only: true

# (02/10/2026) Khong dua bo dem vao ban sao luu HA: bo dem dia cua Chrome (~1,6 GB), mo hinh tai ve, ban MP4 tai ve va
# tep tai len tam cua Quan ly file — deu tu tao lai. Ho so Chrome that (dang nhap, Local Storage, IndexedDB, Service
# Worker) van duoc sao luu. Supervisor so khop tu ben phai duong dan (PurePath.match) nen dung voi moi user_data_dir.
backup_exclude:
  - "*/Default/Cache"
  - "*/Default/Code Cache"
  - "*/Default/GPUCache"
  - "*/Default/DawnWebGPUCache"
  - "*/Default/DawnGraphiteCache"
  - "*/GrShaderCache"
  - "*/GraphiteDawnCache"
  - "*/ShaderCache"
  - "*/optimization_guide_model_store"
  - "*/fm-mp4"
  - "*/fm-tmp"

options:
  browser_locale: "en-US"
  tile_size: 32
  full_frame_tile_count: 4
  full_frame_area_threshold: 0.5
  full_frame_every: 50
  every_nth_frame: 1
  min_frame_interval_ms: 80
  jpeg_quality: 85
  max_bytes_per_message: 61440
  ws_port: 8081
  debug_port: 9221
  expose_debug_proxy: false
  debug_proxy_port: 9222
  health_port: 18080
  prefers_reduced_motion: false
  screensaver_idle_s: 120
  screensaver_photos: true
  morning_briefing: true
  morning_window: "06:00-09:30"
  morning_tts: false
  gphotos_album: ""
  cast_enabled: true
  dial_port: 56790
  # (23/09/2026) /pw-data KHONG nam trong volume ben cua addon — mat het khi
  # container tao lai (moi lan update). /data la thu muc rieng cua addon nay
  # do Supervisor tu cap, LUON ben qua update/restart.
  user_data_dir: "/data/pw-data"

schema:
  browser_locale: str
  tile_size: int
  full_frame_tile_count: int
  full_frame_area_threshold: float
  full_frame_every: int
  every_nth_frame: int
  min_frame_interval_ms: int
  jpeg_quality: int
  max_bytes_per_message: int
  ws_port: int
  debug_port: int
  expose_debug_proxy: bool
  debug_proxy_port: int
  health_port: int
  prefers_reduced_motion: bool
  screensaver_idle_s: "int(0,)?"
  screensaver_photos: "bool?"
  morning_briefing: "bool?"
  morning_window: "match(^\\d{1,2}:\\d{2}-\\d{1,2}:\\d{2}$)?"
  morning_tts: "bool?"
  gphotos_album: "str?"
  cast_enabled: "bool?"
  dial_port: "port?"
  user_data_dir: str
