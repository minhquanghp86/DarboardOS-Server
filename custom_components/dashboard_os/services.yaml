

send:
send:
  name: Dashboard OS
  description: Gửi thông báo ưu tiên cao (mở khoá, bật đèn nền, phủ toàn màn hình) tới màn hình Dashboard OS.
  fields:
    message:
      name: Nội dung
      description: Nội dung thông báo.
      required: true
      example: "Cửa chính vừa mở lúc 22:15"
      selector:
        text:
          multiline: true
    title:
      name: Tiêu đề
      example: "Cảnh báo"
      selector:
        text:
    duration:
      name: Thời gian hiển thị
      description: Số giây hiển thị toàn màn hình trước khi thu gọn. Nhập 0 = không tự thoát, chạm màn hình để đóng.
      default: 10
      selector:
        number:
          min: 0
          max: 600
          unit_of_measurement: giây
          mode: box
    device:
      name: Thiết bị
      description: Chọn một hoặc nhiều màn hình. Bỏ trống = mọi màn hình.
      selector:
        device:
          integration: dashboard_os
          multiple: true
    image:
      name: Ảnh
      description: Chọn từ thư viện media, hoặc dán URL / đường dẫn trong /config
      selector:
        media:
          accept:
            - image/*
    video:
      name: Video
      description: Chọn từ thư viện media, hoặc dán URL / đường dẫn trong /config
      selector:
        media:
          accept:
            - video/*
    audio:
      name: Âm thanh
      description: Chọn từ thư viện media, hoặc dán URL / đường dẫn trong /config
      selector:
        media:
          accept:
            - audio/*
    camera:
      name: Camera
      description: Chọn camera có trong Home Assistant (Frigate, go2rtc, Tapo…)
      selector:
        entity:
          domain: camera
    camera_stream:
      name: Đường dẫn luồng go2rtc
      description: Tên luồng go2rtc nếu camera không có thực thể, ví dụ chuong_cua
      selector:
        text:

