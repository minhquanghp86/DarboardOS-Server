send:
  name: Dashboard OS
  description: Gửi thông báo ưu tiên cao (mở khoá, bật đèn nền, phủ toàn màn hình) tới màn hình Dashboard OS.
  fields:
    message:
      name: Nội dung
      description: Nội dung thông báo.
      required: true
      example: "Cửa chính vừa mở lúc 22:15"
      selector:
        text:
          multiline: true
    title:
      name: Tiêu đề
      example: "Cảnh báo"
      selector:
        text:
    duration:
      name: Thời gian hiển thị
      description: Số giây hiển thị toàn màn hình trước khi thu gọn. Nhập 0 = không tự thoát, chạm màn hình để đóng.
      default: 10
      selector:
        number:
          min: 0
          max: 600
          unit_of_measurement: giây
          mode: box
    device:
      name: Thiết bị
      description: Chọn một hoặc nhiều màn hình. Bỏ trống = mọi màn hình.
      selector:
        device:
          integration: dashboard_os
          multiple: true
    image:
      name: Ảnh
      description: Chọn từ thư viện media, hoặc dán URL / đường dẫn trong /config
      selector:
        media:
          accept:
            - image/*
    video:
      name: Video
      description: Chọn từ thư viện media, hoặc dán URL / đường dẫn trong /config
      selector:
        media:
          accept:
            - video/*
    audio:
      name: Âm thanh
      description: Chọn từ thư viện media, hoặc dán URL / đường dẫn trong /config
      selector:
        media:
          accept:
            - audio/*
    camera:
      name: Camera
      description: Chọn camera có trong Home Assistant (Frigate, go2rtc, Tapo…)
      selector:
        entity:
          domain: camera
    camera_stream:
      name: Đường dẫn luồng go2rtc
      description: Tên luồng go2rtc nếu camera không có thực thể, ví dụ chuong_cua
      selector:
        text:

open_app:
  name: Mở ứng dụng
  description: Mở một ứng dụng trên màn hình DarboardOS (id ứng dụng trong menu của màn).
  target:
    device:
      integration: dashboard_os
  fields:
    app:
      name: Ứng dụng
      required: true
      example: youtube
      selector:
        text:

open_url:
  name: Mở địa chỉ web
  description: Mở một trang web trên màn hình.
  target:
    device:
      integration: dashboard_os
  fields:
    url:
      name: Địa chỉ
      required: true
      example: http://192.168.10.2:8123/dashboard-mobile/3
      selector:
        text:

nav:
  name: Điều hướng
  description: Phím điều hướng của màn hình (như nút cứng trên điện thoại).
  target:
    device:
      integration: dashboard_os
  fields:
    key:
      name: Phím
      required: true
      selector:
        select:
          options:
            - home
            - back
            - recents
            - unlock

wake:
  name: Đánh thức
  description: Bật đèn nền màn hình.
  target:
    device:
      integration: dashboard_os

lock:
  name: Khoá màn hình
  description: Hiện màn hình khoá (phải vuốt lên để mở).
  target:
    device:
      integration: dashboard_os

reload:
  name: Tải lại trang
  description: Tải lại trang đang hiện trên màn hình.
  target:
    device:
      integration: dashboard_os

close_app:
  name: Đóng ứng dụng
  description: Đóng một ứng dụng đang mở trên màn hình.
  target:
    device:
      integration: dashboard_os
  fields:
    app:
      name: Ứng dụng
      required: true
      example: youtube
      selector:
        text:

screenshot:
  name: Chụp màn hình
  description: Lưu ảnh chụp màn hình vào /config/www/dashboard/ và trả về đường dẫn + URL.
  target:
    device:
      integration: dashboard_os
  fields:
    filename:
      name: Tên tệp
      description: Bỏ trống = tự đặt tên theo màn hình và thời gian.
      selector:
        text:

set_brightness:
  name: Độ sáng
  description: Đặt độ sáng đèn nền (0-100).
  target:
    device:
      integration: dashboard_os
  fields:
    brightness:
      name: Độ sáng (%)
      required: true
      selector:
        number:
          min: 0
          max: 100
          mode: slider

set_volume:
  name: Âm lượng
  description: Đặt âm lượng (0-100), tuỳ chọn tắt tiếng.
  target:
    device:
      integration: dashboard_os
  fields:
    volume:
      name: Âm lượng (%)
      required: true
      selector:
        number:
          min: 0
          max: 100
          mode: slider
    mute:
      name: Tắt tiếng
      default: false
      selector:
        boolean:

set_quality:
  name: Chất lượng hình
  description: Chất lượng JPEG gửi xuống màn hình (0 = tự động, khuyến nghị 40-70).
  target:
    device:
      integration: dashboard_os
  fields:
    quality:
      name: Chất lượng (%)
      required: true
      selector:
        number:
          min: 0
          max: 90
          mode: slider

set_rotation:
  name: Góc xoay
  description: Xoay giao diện màn hình (0/90/180/270).
  target:
    device:
      integration: dashboard_os
  fields:
    rotation:
      name: Góc
      required: true
      selector:
        select:
          options:
            - "0"
            - "90"
            - "180"
            - "270"

set_dnd:
  name: Không làm phiền
  description: Bật/tắt chế độ không làm phiền trên màn hình.
  target:
    device:
      integration: dashboard_os
  fields:
    enabled:
      name: Bật
      default: true
      selector:
        boolean:

set_no_sleep:
  name: Không cho màn ngủ
  description: Bật/tắt chế độ giữ màn hình luôn sáng.
  target:
    device:
      integration: dashboard_os
  fields:
    enabled:
      name: Bật
      default: true
      selector:
        boolean:

set_screensaver:
  name: Màn hình chờ
  description: Bật/tắt màn hình chờ (đồng hồ + ảnh).
  target:
    device:
      integration: dashboard_os
  fields:
    enabled:
      name: Bật
      default: true
      selector:
        boolean:

set_setting:
  name: Đổi cài đặt của màn
  description: Đổi trực tiếp một khoá cài đặt (rwv.*) hoặc một thực thể của màn hình.
  target:
    device:
      integration: dashboard_os
  fields:
    setting:
      name: Khoá cài đặt
      required: true
      example: rwv.quality
      selector:
        text:
    value:
      name: Giá trị
      required: true
      selector:
        text:

say:
  name: Đọc thông báo (TTS)
  description: Đọc thành tiếng một câu trên loa của màn hình.
  target:
    device:
      integration: dashboard_os
  fields:
    message:
      name: Nội dung
      required: true
      selector:
        text:
          multiline: true

alarm_create:
  name: Tạo báo thức
  description: Tạo báo thức trên màn hình chọn (hoặc mọi màn). Trả về báo thức vừa tạo.
  target:
    device:
      integration: dashboard_os
  fields:
    time:
      name: Giờ
      description: "Định dạng HH:MM (00:00–23:59)."
      required: true
      example: "06:30"
      selector:
        text:
    days:
      name: Lặp lại
      description: "0 = Chủ nhật … 6 = Thứ bảy. Bỏ trống = báo một lần."
      selector:
        select:
          multiple: true
          options:
            - "0"
            - "1"
            - "2"
            - "3"
            - "4"
            - "5"
            - "6"
    label:
      name: Nhãn
      selector:
        text:
    snooze:
      name: Báo lại (phút)
      default: 10
      selector:
        select:
          options: ["5", "10", "15", "20", "30"]
    enabled:
      name: Bật
      default: true
      selector:
        boolean:

alarm_list:
  name: Danh sách báo thức
  description: Trả về danh sách báo thức (kèm giờ reo kế tiếp) của màn hình chọn.
  target:
    device:
      integration: dashboard_os

alarm_delete:
  name: Xoá báo thức
  description: Xoá theo `alarm_id`, hoặc theo `time`/`label` (xoá mọi báo thức khớp).
  target:
    device:
      integration: dashboard_os
  fields:
    alarm_id:
      name: ID báo thức
      selector:
        text:
    time:
      name: Giờ
      example: "06:30"
      selector:
        text:
    label:
      name: Nhãn
      selector:
        text:

alarm_set_enabled:
  name: Bật/tắt báo thức
  target:
    device:
      integration: dashboard_os
  fields:
    alarm_id:
      name: ID báo thức
      required: true
      selector:
        text:
    enabled:
      name: Bật
      required: true
      selector:
        boolean:

alarm_stop:
  name: Tắt chuông báo thức
  description: Dừng báo thức đang reo trên mọi màn.
  fields:
    alarm_id:
      name: ID báo thức
      required: true
      selector:
        text:

alarm_snooze:
  name: Báo lại
  description: Báo lại sau số phút đã đặt cho báo thức đang reo.
  fields:
    alarm_id:
      name: ID báo thức
      required: true
      selector:
        text:
