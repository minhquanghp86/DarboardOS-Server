alarm_create:
  name: Tạo báo thức
  description: Tạo báo thức trên màn hình chọn (hoặc mọi màn). Trả về báo thức vừa tạo.
  fields:
    device:
      name: Thiết bị
      description: Chọn một hoặc nhiều màn hình. Bỏ trống = mọi màn hình đang kết nối.
      selector:
        device:
          integration: dashboard_os
          multiple: true
    time:
      name: Giờ
      description: "Định dạng 24 giờ HH:MM, ví dụ 06:30."
      required: true
      example: "06:30"
      selector:
        text:
    days:
      name: Lặp lại
      description: "0 = Chủ nhật … 6 = Thứ bảy. Bỏ trống = báo một lần."
      selector:
        select:
          multiple: true
          options:
            - "0"
            - "1"
            - "2"
            - "3"
            - "4"
            - "5"
            - "6"
    label:
      name: Nhãn
      example: "Dậy đi học"
      description: "Tên hiển thị của báo thức, tối đa 40 ký tự."
      selector:
        text:
    snooze:
      name: Báo lại (phút)
      example: "10"
      description: "Số phút báo lại: 5, 10, 15, 20 hoặc 30."
      default: 10
      selector:
        select:
          options: ["5", "10", "15", "20", "30"]
    enabled:
      name: Bật
      description: "Bật = true, tắt = false."
      default: true
      selector:
        boolean:

