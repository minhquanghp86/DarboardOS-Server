          integration: dashboard_os
          multiple: true
    time:
      name: Giờ
      description: "Định dạng HH:MM (00:00–23:59)."
      required: true
      example: "06:30"
      selector:
        text:
    days:
      name: Lặp lại
      description: "0 = Chủ nhật … 6 = Thứ bảy. Bỏ trống = báo một lần."
      selector:
        select:
          multiple: true
          options:
            - "0"
            - "1"
            - "2"
            - "3"
            - "4"
            - "5"
            - "6"
    label:
      name: Nhãn
      selector:
        text:
    snooze:
      name: Báo lại (phút)
      default: 10
      selector:
        select:
          options: ["5", "10", "15", "20", "30"]
    enabled:
      name: Bật
      default: true
      selector:
        boolean:

