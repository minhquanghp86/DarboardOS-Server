set_brightness:
  name: Độ sáng
  description: Đặt độ sáng đèn nền (0-100).
  fields:
    device:
      name: Thiết bị
      description: Chọn một hoặc nhiều màn hình. Bỏ trống = mọi màn hình đang kết nối.
      selector:
        device:
          integration: dashboard_os
          multiple: true
    brightness:
      name: Độ sáng (%)
      example: "70"
      description: "0 = tối nhất, 100 = sáng nhất."
      required: true
      selector:
        number:
          min: 0
          max: 100
          mode: slider

set_volume:
  name: Âm lượng
  description: Đặt âm lượng (0-100), tuỳ chọn tắt tiếng.
  fields:
    device:
      name: Thiết bị
      description: Chọn một hoặc nhiều màn hình. Bỏ trống = mọi màn hình đang kết nối.
      selector:
        device:
          integration: dashboard_os
          multiple: true
    volume:
      name: Âm lượng (%)
      example: "40"
      description: "0–100. Chỉ màn có loa (P4) mới nghe được."
      required: true
      selector:
        number:
          min: 0
          max: 100
          mode: slider
    mute:
      name: Tắt tiếng
      default: false
      selector:
        boolean:

set_quality:
  name: Chất lượng hình
  description: Chất lượng JPEG gửi xuống màn hình (0 = tự động, khuyến nghị 40-70).
