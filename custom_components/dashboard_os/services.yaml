

send:
  name: Dashboard OS
  description: Gửi thông báo ưu tiên cao (mở khoá, bật đèn nền, phủ toàn màn hình) tới màn hình Dashboard OS.
  fields:
    message:
      name: Nội dung
      description: "Câu cần đọc, tối đa 300 ký tự."
      required: true
      example: "Cửa chính vừa mở lúc 22:15"
      selector:
        text:
          multiline: true
    title:
      name: Tiêu đề
      description: "Tiêu đề ngắn hiện phía trên nội dung."
      example: "Cảnh báo"
      selector:
        text:
    duration:
      name: Thời gian hiển thị
      example: "10"
      description: "Số giây hiển thị toàn màn hình (0 = phải chạm để đóng)."
      default: 10
      selector:
        number:
          min: 0
          max: 600
          unit_of_measurement: giây
          mode: box
    device:
      name: Thiết bị
      description: Chọn một hoặc nhiều màn hình. Bỏ trống = mọi màn hình đang kết nối.
      selector:
        device:
          integration: dashboard_os
          multiple: true
    priority:
      name: Mức ưu tiên
      description: "urgent (mặc định) = mở khoá + bật đèn + phủ toàn màn · critical = như urgent, xuyên cả Không làm phiền · high = phủ toàn màn, tôn trọng Không làm phiền · normal = chỉ hiện thông báo."
      default: urgent
      selector:
        select:
          options:
            - urgent
            - critical
            - high
            - normal
    image:
      name: Ảnh
      description: Chọn từ thư viện media, hoặc dán URL / đường dẫn trong /config
      selector:
        media:
          accept:
            - image/*
    video:
      name: Video
      description: Chọn từ thư viện media, hoặc dán URL / đường dẫn trong /config
      selector:
        media:
          accept:
            - video/*
    audio:
      name: Âm thanh
      description: Chọn từ thư viện media, hoặc dán URL / đường dẫn trong /config
      selector:
        media:
          accept:
            - audio/*
    camera:
      name: Camera
      example: "camera.chuong_cua"
      description: "Chọn camera có trong Home Assistant."
      selector:
        entity:
          domain: camera
    camera_stream:
      name: Đường dẫn luồng go2rtc
      example: "chuong_cua"
      description: "Tên luồng go2rtc nếu camera không có thực thể."
      selector:
        text:

open_app:
  name: Mở ứng dụng
  description: Mở một ứng dụng trên màn hình DarboardOS (id ứng dụng trong menu của màn).
  fields:
    device:
      name: Thiết bị
      description: Chọn một hoặc nhiều màn hình. Bỏ trống = mọi màn hình đang kết nối.
      selector:
        device:
          integration: dashboard_os
          multiple: true
    app:
      name: Ứng dụng
      description: "Mã ứng dụng trong menu của màn: youtube, yttv, iptv, camera, music, radio, news, photos, calendar, settings, browser, today, board."
      required: true
      example: youtube
      selector:
        text:

open_url:
  name: Mở địa chỉ web
  description: Mở một trang web trên màn hình.
  fields:
    device:
      name: Thiết bị
      description: Chọn một hoặc nhiều màn hình. Bỏ trống = mọi màn hình đang kết nối.
      selector:
        device:
          integration: dashboard_os
          multiple: true
    url:
      name: Địa chỉ
      description: "Địa chỉ đầy đủ, phải bắt đầu bằng http:// hoặc https://."
      required: true
      example: http://192.168.10.2:8123/dashboard-mobile/3
      selector:
        text:

nav:
  name: Điều hướng
  description: Phím điều hướng của màn hình (như nút cứng trên điện thoại).
