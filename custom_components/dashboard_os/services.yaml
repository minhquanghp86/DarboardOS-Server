send:
  name: DarboardOS
  description: Gửi thông báo tới màn hình DarboardOS.
  fields:
    message:
      name: Nội dung
      description: Nội dung thông báo.
      required: true
      example: "Cửa chính vừa mở lúc 22:15"
      selector:
        text:
          multiline: true
    title:
      name: Tiêu đề
      example: "Cảnh báo"
      selector:
        text:
    priority:
      name: Mức ưu tiên
      description: Khẩn cấp = mở khoá, bật đèn nền, phủ toàn màn hình rồi thu gọn sau 6 giây.
      default: normal
      selector:
        select:
          options:
            - label: Bình thường
              value: normal
            - label: Cao (bật sáng + chuông)
              value: high
            - label: Nghiêm trọng (hiện cả khi Không làm phiền)
              value: critical
            - label: Khẩn cấp (mở khoá, phủ toàn màn hình)
              value: urgent
    device:
      name: Thiết bị
      description: Màn hình nhận thông báo (danh sách do add-on DarboardOS cung cấp).
      default: all
      selector:
        select:
          options:
            - label: "Tất cả màn hình"
              value: "all"
            - label: "7.0 Guition JC1060P470C"
              value: "esp32-80f1b2d35fb5"
            - label: "4.3 Guition JC4827w543"
              value: "esp32-1cdbd49b2260"
            - label: "4.0 Guition 4848S040"
              value: "esp32-28372f8a0218"
            - label: "Chuông cổng"
              value: "esp32-1cdbd449ee60"
    image:
      name: Ảnh
      description: Chọn từ thư viện media, hoặc dán URL / đường dẫn trong /config
      selector:
        media:
          accept:
            - image/*
    video:
      name: Video
      description: Chọn từ thư viện media, hoặc dán URL / đường dẫn trong /config
      selector:
        media:
          accept:
            - video/*
    audio:
      name: Âm thanh
      description: Chọn từ thư viện media, hoặc dán URL / đường dẫn trong /config
      selector:
        media:
          accept:
            - audio/*
    camera:
      name: Camera
      description: Chọn camera có trong Home Assistant (Frigate, go2rtc, Tapo…)
      selector:
        entity:
          domain: camera
    camera_stream:
      name: Đường dẫn luồng go2rtc
      description: Tên luồng go2rtc nếu camera không có thực thể trong Home Assistant, ví dụ chuong_cua
      selector:
        text:
