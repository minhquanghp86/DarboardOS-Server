send:
  name: DarboardOS
  description: Gửi thông báo tới màn hình DarboardOS.
  fields:
    message:
      name: Nội dung
      description: Nội dung thông báo.
      required: true
      example: "Cửa chính vừa mở lúc 22:15"
      selector:
        text:
          multiline: true
    title:
      name: Tiêu đề
      example: "Cảnh báo"
      selector:
        text:
    priority:
      name: Mức ưu tiên
      description: urgent = mở khoá, bật đèn nền, phủ toàn màn hình rồi thu gọn sau 6 giây.
      default: normal
      selector:
        select:
          options:
            - normal
            - high
            - critical
            - urgent
    device:
      name: Thiết bị
      description: Chọn màn hình nhận thông báo. Bỏ trống = mọi màn hình.
      selector:
        device:
          integration: esphome
    image:
      name: Ảnh
      description: Chọn từ thư viện media, hoặc dán URL / đường dẫn trong /config
      selector:
        media:
          accept:
            - image/*
    video:
      name: Video
      description: Chọn từ thư viện media, hoặc dán URL / đường dẫn trong /config
      selector:
        media:
          accept:
            - video/*
    audio:
      name: Âm thanh
      description: Chọn từ thư viện media, hoặc dán URL / đường dẫn trong /config
      selector:
        media:
          accept:
            - audio/*
    app:
      name: Ứng dụng mở khi chạm
      selector:
        text:
    url:
      name: URL mở khi chạm
      selector:
        text:
    camera:
      name: Camera (ảnh chụp)
      description: Tên camera go2rtc, ví dụ chuong_cua
      selector:
        text:
