send_command:
  name: Gửi lệnh nâng cao
  description: Gửi trực tiếp một lệnh của add-on (dùng khi chưa có hành động riêng).
  fields:
    device:
      name: Thiết bị
      description: Chọn một hoặc nhiều màn hình. Bỏ trống = mọi màn hình đang kết nối.
      selector:
        device:
          integration: dashboard_os
          multiple: true
    action:
      name: Lệnh
      description: "Tên lệnh của add-on, ví dụ: saver, dnd, media, close, tab, ntClear."
      required: true
      example: media
      selector:
        text:
    data:
      name: Dữ liệu
      description: Object JSON kèm theo (ví dụ {"cmd":"play"}).
      selector:
        object:
